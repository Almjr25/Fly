<script>
'use strict';
const KEY='fly.contabilidade.v1';
const money=n=>((n||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dec=n=>((n||0)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtDate=s=>s.split('-').reverse().join('/');
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&s.slice(0,4)>='1900'&&s.slice(0,4)<='9999'&&!isNaN(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s;
function cents(s){s=String(s).trim();if(!s)return 0;if(!/^\d+(?:\.\d{3})*(?:,\d{1,2})?$/.test(s))throw Error('Use valores como 1.234,56, sem sinal ou símbolo de moeda.');const parts=s.replace(/\./g,'').split(',');const v=Number(parts[0])*100+Number((parts[1]||'').padEnd(2,'0'));if(!Number.isSafeInteger(v)||v>1e14)throw Error('Valor fora do limite permitido.');return v;}
const kinds={asset:'Ativo',funding:'Passivo e PL',liability:'Passivo',equity:'Patrimônio líquido',revenue:'Receitas',expense:'Despesas'};
const kindColors={asset:'#245FA5',funding:'#B65B22',liability:'#B65B22',equity:'#79509C',revenue:'#247A46',expense:'#BB3944'};
const tint=(kind,text)=>`<span style="color:${kindColors[kind]}">${esc(text)}</span>`;
const accountName=a=>a.kind==='funding'?`${tint('liability','Passivo')} e ${tint('equity','Patrimônio líquido')}`:tint(a.kind,a.name);
const normalizeQuery=s=>s.replace(/[—–]/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');
function matchingAccounts(accounts,query){const q=normalizeQuery(query).trim(),terms=q.split(/\s+/).filter(Boolean),rank=a=>a.code===q?0:a.code.startsWith(q)?1:normalizeQuery(a.name).startsWith(q)?2:3;return terms.length?accounts.filter(a=>a.postable&&terms.every(t=>normalizeQuery(a.code+' '+a.name).includes(t))).sort((a,b)=>rank(a)-rank(b)||compare(a,b)):[];}
function counterpartAccounts(c,e,line){const ids=new Set(e.lines.filter(other=>line.debit>0?other.credit>0:other.debit>0).map(other=>other.account));return c.accounts.filter(a=>ids.has(a.id)).sort(compare);}
const creditKind=k=>['funding','liability','equity','revenue'].includes(k);
const compare=(a,b)=>a.code.localeCompare(b.code,'pt-BR',{numeric:true});
function initialAccounts(){const rows=[['1','Ativo','asset',false],['1.1','Ativo circulante','asset',false],['1.1.01','Caixa','asset',true],['1.1.02','Bancos conta movimento','asset',true],['1.1.03','Clientes','asset',true],['1.1.04','Estoques','asset',true],['1.2','Ativo não circulante','asset',false],['1.2.01','Imobilizado','asset',true],['1.2.02','Depreciação acumulada','asset',true],['2','Passivo e patrimônio líquido','funding',false],['2.1','Passivo circulante','liability',false],['2.1.01','Fornecedores','liability',true],['2.1.02','Tributos a recolher','liability',true],['2.1.03','Obrigações trabalhistas','liability',true],['2.2','Passivo não circulante','liability',false],['2.2.01','Empréstimos de longo prazo','liability',true],['2.3','Patrimônio líquido','equity',false],['2.3.1','Capital e resultados','equity',false],['2.3.1.01','Capital social','equity',true],['2.3.1.02','Lucros ou prejuízos acumulados','equity',true],['3','Receitas','revenue',false],['3.1','Receitas operacionais','revenue',false],['3.1.01','Receita de serviços','revenue',true],['3.1.02','Receita de vendas','revenue',true],['3.1.03','Deduções da receita','revenue',true],['3.2','Outras receitas','revenue',false],['3.2.01','Receitas financeiras','revenue',true],['4','Despesas e custos','expense',false],['4.1','Custos','expense',false],['4.1.01','Custos dos serviços e mercadorias','expense',true],['4.2','Despesas operacionais','expense',false],['4.2.01','Despesas administrativas','expense',true],['4.2.02','Salários e encargos','expense',true],['4.2.03','Aluguéis','expense',true],['4.2.04','Despesas financeiras','expense',true],['4.2.05','Depreciação','expense',true]];return rows.map(([code,name,kind,postable])=>({id:uid(),code,name,kind,postable,normal:creditKind(kind)?'C':'D'}));}
function sum(nums){let n=0;for(const v of nums){n+=v;if(!Number.isSafeInteger(n))throw Error('Total excedeu a precisão segura.');}return n;}
function sortedEntries(c){return [...c.entries].sort((a,b)=>a.date.localeCompare(b.date)||Number(!!a.closing)-Number(!!b.closing)||a.number-b.number);}
function movements(c,from='',to='9999-12-31',excludeClosing=false){const out=Object.fromEntries(c.accounts.map(a=>[a.id,{debit:0,credit:0}]));for(const e of c.entries){if(e.date<from||e.date>to||(excludeClosing&&e.closing))continue;for(const l of e.lines){const m=out[l.account];if(!m)throw Error('Conta do lançamento não encontrada.');m.debit=sum([m.debit,l.debit]);m.credit=sum([m.credit,l.credit]);}}return out;}
const raw=m=>m.debit-m.credit;
const natural=(a,n)=>creditKind(a.kind)?-n:n;
function validateEntry(e,c){if(!validDate(e.date))throw Error('Informe uma data válida, a partir de 1900.');if(!e.memo?.trim())throw Error('Informe o histórico.');if(!Array.isArray(e.lines)||e.lines.length<2)throw Error('Inclua pelo menos duas partidas.');for(const l of e.lines){if(!c.accounts.some(a=>a.id===l.account&&a.postable))throw Error('Selecione uma conta analítica em cada partida.');if(!Number.isSafeInteger(l.debit)||!Number.isSafeInteger(l.credit)||l.debit<0||l.credit<0||(l.debit>0)===(l.credit>0)||Math.max(l.debit,l.credit)>1e14)throw Error('Cada partida deve ter somente um débito ou um crédito positivo.');}const d=sum(e.lines.map(l=>l.debit)),cr=sum(e.lines.map(l=>l.credit));if(d!==cr)throw Error(`Débitos e créditos não conferem. Diferença: ${money(Math.abs(d-cr))}.`);return e;}
function closeLines(c,date,target,omitId){const scope={...c,entries:c.entries.filter(e=>e.id!==omitId&&e.date<=date)};const mv=movements(scope);const lines=[];for(const a of c.accounts.filter(a=>a.postable&&['revenue','expense'].includes(a.kind))){const n=raw(mv[a.id]);if(n)lines.push({account:a.id,debit:n<0?-n:0,credit:n>0?n:0});}const net=sum(lines.map(l=>l.debit-l.credit));if(net)lines.push({account:target,debit:net<0?-net:0,credit:net>0?net:0});return lines;}
function validateDB(db){if(!db||![1,2].includes(db.version)||!Array.isArray(db.companies)||db.companies.length>500)throw Error('Backup incompatível: esperado formato Fly versão 1 ou 2.');const ids=new Set();for(const c of db.companies){if(!c||typeof c.id!=='string'||ids.has(c.id)||typeof c.name!=='string'||!c.name.trim()||!Array.isArray(c.accounts)||!Array.isArray(c.entries))throw Error('Empresa inválida no backup.');ids.add(c.id);const ai=new Set(),codes=new Set();for(const a of c.accounts){if(typeof a.id!=='string'||ai.has(a.id)||typeof a.code!=='string'||!/^\d+(\.\d+)*$/.test(a.code)||codes.has(a.code)||typeof a.name!=='string'||!a.name.trim()||!kinds[a.kind]||typeof a.postable!=='boolean'||!['D','C'].includes(a.normal))throw Error('Plano de contas inválido.');ai.add(a.id);codes.add(a.code);}for(const a of c.accounts){const children=c.accounts.filter(b=>b.code.startsWith(a.code+'.'));if(a.kind==='funding'&&(db.version!==2||a.code!=='2'||a.postable))throw Error('O grupo Passivo e PL deve ser sintético, com código 2.');if((a.postable&&children.length)||children.some(b=>a.kind==='funding'?!['liability','equity'].includes(b.kind):b.kind!==a.kind))throw Error('Hierarquia de contas inválida.');}const ei=new Set(),numbers=new Set();for(const e of c.entries){if(typeof e.id!=='string'||ei.has(e.id)||!Number.isSafeInteger(e.number)||e.number<1||numbers.has(e.number)||typeof e.memo!=='string')throw Error('Identificação de lançamento inválida.');ei.add(e.id);numbers.add(e.number);validateEntry(e,c);if(e.closing&&(!Number.isInteger(e.year)||e.date!==`${e.year}-12-31`||!c.accounts.some(a=>a.id===e.target&&a.kind==='equity'&&a.postable)))throw Error('Encerramento inválido.');}if(new Set(c.entries.filter(e=>e.closing).map(e=>e.year)).size!==c.entries.filter(e=>e.closing).length)throw Error('Há encerramentos duplicados.');movements(c);}return db;}
// Version 2 changes account codes only. Entry IDs, account IDs and closing targets stay intact.
function migrateDB(data){
 validateDB(data);if(data.version===2)return data;
 const next=structuredClone(data);next.version=2;
 for(const c of next.companies){
  let equityBranch=3;
  while(c.accounts.some(a=>a.kind==='liability'&&(a.code===`2.${equityBranch}`||a.code.startsWith(`2.${equityBranch}.`))))equityBranch++;
  for(const a of c.accounts){
   if(a.kind==='equity'&&/^3(?:\.|$)/.test(a.code))a.code=a.code.replace(/^3/,`2.${equityBranch}`);
   else if(a.kind==='revenue'&&/^4(?:\.|$)/.test(a.code))a.code=a.code.replace(/^4/,'3');
   else if(a.kind==='expense'&&/^5(?:\.|$)/.test(a.code))a.code=a.code.replace(/^5/,'4');
   else if(a.code==='2'&&a.kind==='liability'&&!a.postable){a.kind='funding';a.name='Passivo e patrimônio líquido';}
  }
 }
 return validateDB(next);
}
let db={version:2,active:null,companies:[]},loadError='',savedRecord=null;
const entryDrafts=new Map();
try{const stored=localStorage.getItem(KEY);savedRecord=stored;if(stored){const parsed=JSON.parse(stored),next=migrateDB(parsed);if(parsed.version===1){if(!localStorage.getItem(KEY+'.antes-plano-v2'))localStorage.setItem(KEY+'.antes-plano-v2',stored);const upgraded=JSON.stringify(next);localStorage.setItem(KEY,upgraded);savedRecord=upgraded;}db=next;}}catch(e){loadError='Não foi possível ler os dados locais. Os dados existentes não serão sobrescritos. Exporte os dados locais originais ou restaure um backup válido. Detalhe: '+e.message;}
let tab='entries',from=today().slice(0,4)+'-01-01',to=today().slice(0,4)+'-12-31',accountFilter='',search='',dialogDirty=false;
const company=()=>db.companies.find(c=>c.id===db.active)||db.companies[0];
function commit(next,restore=false){if(!restore&&(loadError||localStorage.getItem(KEY)!==savedRecord))throw Error('Os dados locais foram alterados ou não puderam ser lidos. Recarregue a página antes de salvar.');validateDB(next);const data=JSON.stringify(next);localStorage.setItem(KEY,data);savedRecord=data;db=next;loadError='';}
function mutate(fn,afterCommit){const next=structuredClone(db);fn(next,next.companies.find(c=>c.id===(company()?.id)));commit(next);afterCommit?.();render();}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,5000);}
function safe(fn){try{fn();}catch(e){showError(e.message);}}
function showError(msg){const el=document.querySelector('#dialogError');if(document.querySelector('#dialog').open&&el)el.textContent=msg;else{const el=document.querySelector('#entryError')||document.querySelector('#pageError');el.textContent=msg;el.hidden=false;}}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function backup(){if(loadError){download('fly-dados-originais.json',localStorage.getItem(KEY)||'','application/json');return;}download(`fly-backup-${today()}.json`,JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'application/json');toast('Backup exportado. Guarde o arquivo em um local seguro.');}
function accountOptions(selected='',filter=()=>true){return company().accounts.filter(a=>a.postable&&filter(a)).sort(compare).map(a=>`<option style="color:${kindColors[a.kind]}" value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(a.code+' — '+a.name)}</option>`).join('');}
function openDialog(title,body,foot){const d=document.querySelector('#dialog');document.querySelector('#dialogContent').innerHTML=`<div class="dialog-head"><h2 style="margin:0">${esc(title)}</h2><button type="button" data-action="dismiss" aria-label="Fechar">✕</button></div><form id="dialogForm"><div class="dialog-body">${body}<div id="dialogError" class="error" role="alert"></div></div><div class="dialog-foot"><button type="button" data-action="dismiss">Cancelar</button>${foot}</div></form>`;dialogDirty=false;document.querySelector('#dialogForm').addEventListener('input',()=>dialogDirty=true);if(!d.open)d.showModal();}
function dismiss(){closeAccountSuggestions();if(dialogDirty&&!confirm('Descartar as alterações deste formulário?'))return;document.querySelector('#dialog').close();dialogDirty=false;}
function finishDialog(){closeAccountSuggestions();document.querySelector('#dialog').close();dialogDirty=false;}
function companyDialog(edit=false){const c=edit?company():null;openDialog(edit?'Editar empresa':'Nova empresa',`<div class="grid"><label>Nome / razão social<input name="name" required maxlength="150" value="${esc(c?.name)}"></label><label>CNPJ (opcional)<input name="document" maxlength="30" value="${esc(c?.document)}"></label></div><p class="muted">Cada empresa tem seu próprio plano de contas e lançamentos. A abertura dos saldos é feita por lançamento contábil.</p>`,`<button class="primary">${edit?'Salvar':'Criar empresa'}</button>`);document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();safe(()=>{if(loadError)throw Error('Restaure ou exporte os dados locais antes de criar empresas.');const f=new FormData(e.target),name=f.get('name').trim();if(!name)throw Error('Informe o nome.');mutate((next,co)=>{if(edit){co.name=name;co.document=f.get('document').trim();}else{const id=uid();next.companies.push({id,name,document:f.get('document').trim(),accounts:initialAccounts(),entries:[]});next.active=id;}});finishDialog();toast('Empresa salva.');});};}
function invalidateClosings(c,date,except){for(const e of c.entries)if(e.closing&&e.id!==except&&e.date>=date)e.stale=true;}

let accountSuggestions=null;
function closeAccountSuggestions(){if(!accountSuggestions)return;const {input,box}=accountSuggestions;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');box.remove();accountSuggestions=null;}
function positionSuggestions(){
 if(!accountSuggestions)return;
 const {input,box}=accountSuggestions;if(!input.isConnected){closeAccountSuggestions();return;}
 const r=input.getBoundingClientRect(),below=innerHeight-r.bottom-10,above=r.top-10,down=below>=150||below>=above;
 const height=Math.max(40,Math.min(250,down?below:above)),width=Math.min(Math.max(r.width,390),innerWidth-16);
 Object.assign(box.style,{left:Math.max(8,Math.min(r.left,innerWidth-width-8))+'px',width:width+'px',maxHeight:height+'px',top:down?r.bottom+4+'px':'auto',bottom:down?'auto':innerHeight-r.top+4+'px'});
}
function bindAccountInput(input,draftLine,onChange){
 const selected=company().accounts.find(a=>a.id===draftLine.account);
 input.value=draftLine.query??(selected?selected.code+' — '+selected.name:'');input.dataset.account=draftLine.account||'';
 if(selected)input.style.color=kindColors[selected.kind];
 const show=()=>{
  closeAccountSuggestions();const matches=matchingAccounts(company().accounts,input.value);if(!input.value.trim())return;
  const box=document.createElement('div');box.id='account-options-'+uid();box.className='account-suggestions';box.setAttribute('role','listbox');box.setAttribute('aria-label','Contas encontradas');
  const choose=a=>{input.value=a.code+' — '+a.name;input.dataset.account=a.id;input.style.color=kindColors[a.kind];draftLine.account=a.id;draftLine.query=input.value;closeAccountSuggestions();onChange();input.focus();};
  for(const [i,a] of matches.entries()){const option=document.createElement('div');option.id=box.id+'-'+i;option.className='account-suggestion';option.setAttribute('role','option');option.setAttribute('aria-selected','false');option.innerHTML=`${tint(a.kind,a.code)} <span>${accountName(a)}</span>`;option.onpointerdown=e=>{e.preventDefault();choose(a);};box.append(option);}
  if(!matches.length)box.innerHTML='<div class="no-suggestions">Nenhuma conta analítica encontrada.</div>';
  (input.closest('dialog')||document.body).append(box);input.setAttribute('aria-controls',box.id);input.setAttribute('aria-expanded','true');accountSuggestions={input,box,matches,index:-1,choose};positionSuggestions();
 };
 input.oninput=()=>{input.dataset.account='';input.style.color='';draftLine.account='';draftLine.query=input.value;onChange();show();};
 input.onfocus=()=>{if(!input.dataset.account)show();};
 input.onblur=()=>{if(accountSuggestions?.input===input)closeAccountSuggestions();};
 input.onkeydown=e=>{
  if(e.isComposing)return;
  if(e.key==='Escape'){if(accountSuggestions?.input===input){e.preventDefault();e.stopPropagation();closeAccountSuggestions();}return;}
  if(['ArrowDown','ArrowUp'].includes(e.key)){
   e.preventDefault();if(accountSuggestions?.input!==input)show();const state=accountSuggestions;if(!state?.matches.length)return;
   state.index=state.index<0?(e.key==='ArrowDown'?0:state.matches.length-1):(state.index+(e.key==='ArrowDown'?1:-1)+state.matches.length)%state.matches.length;
   [...state.box.children].forEach((el,i)=>el.setAttribute('aria-selected',String(i===state.index)));const active=state.box.children[state.index];input.setAttribute('aria-activedescendant',active.id);active.scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){e.preventDefault();const state=accountSuggestions;if(state?.input===input&&state.index>=0)state.choose(state.matches[state.index]);}
 };
}
window.addEventListener('resize',positionSuggestions);
document.addEventListener('scroll',positionSuggestions,true);
document.addEventListener('pointerdown',e=>{if(accountSuggestions&&e.target!==accountSuggestions.input&&!accountSuggestions.box.contains(e.target))closeAccountSuggestions();});
function blankEntryDraft(date=today()){return {date,reference:'',memo:'',lines:[{account:'',query:'',debit:'',credit:''},{account:'',query:'',debit:'',credit:''}],dirty:false};}
function draftFromEntry(e){return {...e,lines:e.lines.map(l=>{const a=company().accounts.find(a=>a.id===l.account);return {account:l.account,query:a.code+' — '+a.name,debit:l.debit?dec(l.debit):'',credit:l.credit?dec(l.credit):''};}),dirty:false};}
function getEntryDraft(){const c=company();if(!entryDrafts.has(c.id))entryDrafts.set(c.id,blankEntryDraft());return entryDrafts.get(c.id);}
function entryFields(draft,inline=false){return `<div class="entry-meta"><label>Data<input type="date" name="date" required min="1900-01-01" max="9999-12-31" value="${esc(draft.date)}"></label><label>Documento / referência<input name="reference" maxlength="150" value="${esc(draft.reference)}"></label><label>Histórico<textarea name="memo" rows="1" required maxlength="2000">${esc(draft.memo)}</textarea></label></div>${draft.closing?'<div class="notice warning">Encerramento editável. Alterações serão sinalizadas para revisão e podem ser substituídas ao recalcular.</div>':''}<div class="entry-lines-scroll"><table class="entry-lines"><thead><tr><th>Conta analítica · digite o código ou nome e selecione uma sugestão</th><th class="num">Débito (R$)</th><th class="num">Crédito (R$)</th><th></th></tr></thead><tbody class="entry-lines-body"></tbody></table></div><div class="entry-controls"><button type="button" class="add-line">+ Partida</button><span class="entry-totals" aria-live="polite"></span>${inline?entryButtons(draft,true):''}</div>`;}
function entryButtons(draft,inline){return `${draft.id?'<button type="button" class="danger delete-entry">Excluir lançamento</button>':''}${inline?'<button type="button" class="clear-entry">Novo / Limpar</button>':''}<button class="primary">Salvar lançamento</button>`;}
function mountEntryEditor(form,draft,inline){
 const c=company(),old=c.entries.find(e=>e.id===draft.id),body=form.querySelector('.entry-lines-body');
 const changed=()=>{draft.dirty=true;if(!inline)dialogDirty=true;};
 const readLines=()=>draft.lines.map(l=>({account:l.account,debit:cents(l.debit),credit:cents(l.credit)}));
 const totals=()=>{const el=form.querySelector('.entry-totals');try{const ls=readLines(),d=sum(ls.map(l=>l.debit)),cr=sum(ls.map(l=>l.credit));el.innerHTML=`Débitos <b>${money(d)}</b> · Créditos <b>${money(cr)}</b> · <span class="${d===cr?'good':'bad'}">Diferença ${money(Math.abs(d-cr))}</span>`;}catch(e){el.textContent=e.message;}};
 const add=l=>{
  const tr=document.createElement('tr');tr.innerHTML=`<td><input class="account-query" aria-label="Conta" role="combobox" aria-autocomplete="list" aria-expanded="false" autocomplete="off" spellcheck="false" placeholder="Código ou nome da conta"></td><td><input aria-label="Débito" inputmode="decimal" placeholder="0,00" value="${esc(l.debit)}"></td><td><input aria-label="Crédito" inputmode="decimal" placeholder="0,00" value="${esc(l.credit)}"></td><td><button type="button" class="small danger" aria-label="Remover partida">✕</button></td>`;
  bindAccountInput(tr.querySelector('.account-query'),l,changed);
  for(const [label,field] of [['Débito','debit'],['Crédito','credit']])tr.querySelector(`[aria-label="${label}"]`).oninput=e=>{l[field]=e.target.value;changed();totals();};
  tr.querySelector('button').onclick=()=>{closeAccountSuggestions();draft.lines.splice(draft.lines.indexOf(l),1);tr.remove();changed();totals();};body.append(tr);
 };
 draft.lines.forEach(add);totals();
 for(const name of ['date','reference','memo'])form.elements[name].oninput=e=>{draft[name]=e.target.value;changed();};
 form.querySelector('.add-line').onclick=()=>{const l={account:'',query:'',debit:'',credit:''};draft.lines.push(l);add(l);changed();body.lastElementChild.querySelector('input').focus();};
 if(inline)form.querySelector('.clear-entry').onclick=()=>{if(draft.dirty&&!confirm('Descartar o lançamento em edição?'))return;entryDrafts.set(c.id,blankEntryDraft(draft.date));render();};
 if(old)form.querySelector('.delete-entry').onclick=()=>{if(!confirm(`Excluir permanentemente o lançamento #${old.number}?`))return;safe(()=>{mutate((_,co)=>{co.entries=co.entries.filter(e=>e.id!==old.id);invalidateClosings(co,old.date);},()=>{if(inline||entryDrafts.get(c.id)?.id===old.id)entryDrafts.set(c.id,blankEntryDraft(draft.date));});if(!inline)finishDialog();toast('Lançamento excluído.');});};
 form.onsubmit=e=>{e.preventDefault();try{
  const entry={...old,id:old?.id||uid(),number:old?.number||c.entries.reduce((n,e)=>Math.max(n,e.number),0)+1,date:draft.date,reference:draft.reference.trim(),memo:draft.memo.trim(),lines:readLines()};
  if(old?.closing&&entry.date!==old.date)throw Error('O encerramento deve permanecer em 31/12 do exercício.');if(old?.closing)entry.stale=true;validateEntry(entry,c);
  mutate((_,co)=>{const i=co.entries.findIndex(e=>e.id===entry.id);if(i<0)co.entries.push(entry);else co.entries[i]=entry;invalidateClosings(co,[entry.date,old?.date||entry.date].sort()[0],entry.id);},()=>{if(inline)entryDrafts.set(c.id,blankEntryDraft(entry.date));});
  if(!inline)finishDialog();else document.querySelector('#entryForm [name=memo]')?.focus();toast('Lançamento salvo. Relatórios atualizados.');
 }catch(err){const error=form.querySelector('[role="alert"]');error.textContent=err.message;error.hidden=false;}};
}
function entryDialog(id){
 const old=company().entries.find(e=>e.id===id);if(!old)return;
 if(tab==='entries'){const current=getEntryDraft();if(current.dirty&&!confirm('Descartar o lançamento em edição para abrir outro?'))return;entryDrafts.set(company().id,draftFromEntry(old));render();return;}
 const draft=draftFromEntry(old);openDialog(`Editar lançamento #${old.number}`,entryFields(draft),entryButtons(draft,false));mountEntryEditor(document.querySelector('#dialogForm'),draft,false);
}

function accountDialog(id){const c=company(),a=c.accounts.find(a=>a.id===id),used=c.entries.some(e=>e.lines.some(l=>l.account===id));openDialog(a?'Editar conta':'Nova conta',`<div class="grid"><label>Código hierárquico<input name="code" required pattern="[0-9]+(\\.[0-9]+)*" value="${esc(a?.code)}" placeholder="1.1.05"></label><label>Nome<input name="name" required maxlength="150" value="${esc(a?.name)}"></label><label>Grupo<select name="kind">${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${a?.kind===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Tipo<select name="postable"><option value="true" ${a?.postable!==false?'selected':''}>Analítica — recebe lançamentos</option><option value="false" ${a?.postable===false?'selected':''}>Sintética — totaliza subcontas</option></select></label><label>Natureza esperada<select name="normal"><option value="D" ${a?.normal!=='C'?'selected':''}>Devedora</option><option value="C" ${a?.normal==='C'?'selected':''}>Credora</option></select></label></div><p class="muted">Use pontos para a hierarquia. Contas sintéticas totalizam os códigos abaixo delas. O grupo determina a apresentação no balanço/DRE; a natureza informa o saldo esperado. ${used?'Esta conta já possui lançamentos: seu grupo e código são preservados.':''}</p>`,`${a?'<button type="button" class="danger" id="deleteAccount">Excluir conta</button>':''}<button class="primary">Salvar conta</button>`);
if(!a)document.querySelector('[name=kind]').onchange=e=>{document.querySelector('[name=normal]').value=creditKind(e.target.value)?'C':'D';};
if(a)document.querySelector('#deleteAccount').onclick=()=>safe(()=>{if(used)throw Error('Não é possível excluir uma conta com lançamentos.');if(c.accounts.some(b=>b.code.startsWith(a.code+'.')))throw Error('Remova primeiro as subcontas.');if(!confirm('Excluir esta conta?'))return;mutate((_,co)=>co.accounts=co.accounts.filter(b=>b.id!==id));finishDialog();});
document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();safe(()=>{const f=new FormData(e.target),n={id:a?.id||uid(),code:f.get('code').trim(),name:f.get('name').trim(),kind:f.get('kind'),postable:f.get('postable')==='true',normal:f.get('normal')};if(!n.name||!/^\d+(\.\d+)*$/.test(n.code))throw Error('Informe código e nome válidos.');if(c.accounts.some(b=>b.id!==id&&b.code===n.code))throw Error('Já existe uma conta com esse código.');if(used&&(n.code!==a.code||n.kind!==a.kind||!n.postable))throw Error('Conta com lançamentos: código, grupo e tipo analítico não podem ser alterados.');if(a&&c.accounts.some(b=>b.code.startsWith(a.code+'.'))&&n.code!==a.code)throw Error('O código de uma conta com subcontas não pode ser alterado.');mutate((_,co)=>{const i=co.accounts.findIndex(b=>b.id===id);if(i<0)co.accounts.push(n);else co.accounts[i]=n;});finishDialog();toast('Plano de contas atualizado.');});};}
function closingDialog(){const year=Number(to.slice(0,4)),c=company();openDialog('Encerrar resultado do exercício',`<div class="notice">A rotina zera os saldos de receitas e despesas até 31/12 e transfere o resultado para uma conta do patrimônio líquido. A DRE ignora as partidas de encerramento. Não é necessário usar uma conta transitória de apuração.</div><div class="grid"><label>Exercício<input type="number" min="1900" max="9999" name="year" value="${year}" required></label><label>Conta de destino do resultado<select name="target" required>${accountOptions(c.accounts.find(a=>a.kind==='equity'&&a.name==='Lucros ou prejuízos acumulados')?.id,a=>a.kind==='equity')}</select></label></div><p class="muted">Encerre os exercícios em ordem. Se houver alteração posterior dos lançamentos, o sistema sinaliza os encerramentos afetados; recalcule-os para atualizar os saldos.</p>`,`<button class="primary">Gerar encerramento</button>`);document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();safe(()=>{const f=new FormData(e.target),y=Number(f.get('year')),target=f.get('target'),date=`${y}-12-31`;if(!validDate(date))throw Error('Exercício inválido.');if(c.entries.some(e=>e.closing&&e.year===y))throw Error('Esse exercício já possui encerramento. Use Recalcular encerramentos.');if(c.entries.some(e=>e.closing&&e.year>y))throw Error('Exclua os encerramentos posteriores ou recalcule-os após encerrar este exercício.');if(!c.accounts.some(a=>a.id===target&&a.kind==='equity'&&a.postable))throw Error('Escolha uma conta analítica do patrimônio líquido.');const lines=closeLines(c,date,target);if(!lines.length)throw Error('Não há saldos de resultado a encerrar.');const entry={id:uid(),number:Math.max(0,...c.entries.map(e=>e.number))+1,date,reference:'ENC-'+y,memo:`Encerramento do resultado — exercício ${y}`,lines,closing:true,year:y,target,stale:false};validateEntry(entry,c);mutate((_,co)=>co.entries.push(entry));finishDialog();toast('Encerramento gerado.');});};}
function recalc(){if(!confirm('Reconstruir todos os lançamentos de encerramento, em ordem cronológica? Edições manuais dessas partidas serão substituídas.'))return;safe(()=>{mutate((_,c)=>{const closes=c.entries.filter(e=>e.closing).sort((a,b)=>a.date.localeCompare(b.date));c.entries=c.entries.filter(e=>!e.closing);for(const e of closes){e.lines=closeLines(c,e.date,e.target);e.stale=false;if(e.lines.length){validateEntry(e,c);c.entries.push(e);}}});toast('Encerramentos recalculados. Encerramentos sem saldo foram removidos.');});}
const tabs=[['entries','Lançamentos'],['accounts','Plano de contas'],['trial','Balancete'],['ledger','Razão'],['journal','Diário'],['balance','Balanço'],['income','DRE'],['settings','Dados e empresas']];
function table(headers,rows,cls=''){return `<div class="table-wrap"><table class="${cls}"><thead><tr>${headers.map((h,i)=>`<th class="${i&&/Saldo|Débito|Crédito|Valor|Movimento|Anterior|Atual/.test(h)?'num':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Nenhum dado para este filtro.</td></tr>`}</tbody></table></div>`;}
const debitCredit=n=>n===0?'—':`${money(Math.abs(n))} ${n>0?'D':'C'}`;
let exportRows=[];
function render(){closeAccountSuggestions();document.body.classList.toggle('entries-view',tab==='entries'&&!!company());const c=company();document.querySelector('#companySelect').innerHTML=c?db.companies.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join(''):'<option>Nenhuma empresa</option>';document.querySelector('#nav').innerHTML=tabs.map(([k,n])=>`<button data-tab="${k}" class="${k===tab?'active':''}">${n}</button>`).join('');const m=document.querySelector('#main');if(!c){m.innerHTML=`<div id="pageError" class="notice warning" ${loadError?'':'hidden'}>${esc(loadError)}</div><div class="card empty"><h1>Seu escritório, no seu navegador.</h1><p>Cadastre uma empresa para começar o plano de contas e seus lançamentos contábeis.</p><button class="primary" data-action="new-company" ${loadError?'disabled':''}>+ Criar primeira empresa</button><button data-action="restore">Restaurar backup</button></div>`;bindMain();return;}
let html=`<div id="pageError" class="notice warning" ${loadError?'':'hidden'}>${esc(loadError)}</div><div class="report-title"><div><h1>${esc(tabs.find(t=>t[0]===tab)[1])}</h1><div class="muted report-heading">${esc(c.name)}${c.document?' · '+esc(c.document):''}</div></div></div>`;
if(c.entries.some(e=>e.closing&&e.stale))html+='<div class="notice warning">Há encerramentos que precisam de revisão após alterações. O balanço e os saldos podem refletir encerramentos desatualizados. <button class="small" data-action="recalc">Recalcular encerramentos</button></div>';
if(!['accounts','settings'].includes(tab))html+=`<div class="toolbar"><label>De<input type="date" id="from" min="1900-01-01" max="9999-12-31" value="${from}"></label><label>${tab==='balance'?'Posição em':'Até'}<input type="date" id="to" min="1900-01-01" max="9999-12-31" value="${to}"></label><button data-action="apply">Aplicar período</button>${tab==='ledger'?`<label>Conta<select id="ledgerAccount"><option value="">Selecione a conta</option>${accountOptions(accountFilter)}</select></label>`:''}<span class="spacer"></span>${tab==='entries'?'':'<button data-action="csv">Exportar CSV</button>'}</div>`;
exportRows=[];
if(tab==='entries')html+=renderEntries(c);
if(tab==='accounts')html+=renderAccounts(c);
if(tab==='trial')html+=renderTrial(c);
if(tab==='ledger')html+=renderLedger(c);
if(tab==='journal')html+=renderJournal(c);
if(tab==='balance')html+=renderBalance(c);
if(tab==='income')html+=renderIncome(c);
if(tab==='settings')html+=renderSettings(c);
m.innerHTML=html;bindMain();if(tab==='entries')mountEntryEditor(document.querySelector('#entryForm'),getEntryDraft(),true);}

function renderEntries(c){
 const es=sortedEntries(c).filter(e=>e.date>=from&&e.date<=to&&(!search||[e.memo,e.reference,String(e.number),...e.lines.map(l=>{const a=c.accounts.find(a=>a.id===l.account);return a.code+' '+a.name;})].join(' ').toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR'))));
 const total=sum(es.map(e=>sum(e.lines.map(l=>l.debit)))),draft=getEntryDraft();
 return `<div class="entries-workspace"><form id="entryForm" class="card entry-editor"><div class="editor-title"><h2>${draft.id?'Editar lançamento #'+draft.number:'Novo lançamento'}</h2><span class="muted">Partidas dobradas · abertura e movimentos</span></div>${entryFields(draft,true)}<div id="entryError" class="error" role="alert" hidden></div></form><div class="card entries-list"><div class="toolbar"><label class="search-label"><span class="sr-only">Pesquisar histórico, documento, número ou conta</span><input id="search" value="${esc(search)}" placeholder="Pesquisar lançamentos"></label><button data-action="search">Pesquisar</button><span class="muted entry-count">${es.length} lançamentos · ${money(total)}</span><button data-action="closing">Encerrar resultado</button></div>${table(['Nº','Data','Histórico','Documento','Valor',''],es.map(e=>`<tr data-entry="${esc(e.id)}"><td>#${e.number}</td><td>${fmtDate(e.date)}</td><td class="wrap">${esc(e.memo)} ${e.closing?'<span class="tag">Encerramento</span>':''}</td><td>${esc(e.reference)}</td><td class="num">${money(sum(e.lines.map(l=>l.debit)))}</td><td><button class="small" data-edit="${esc(e.id)}">Editar</button></td></tr>`).join(''))}</div></div>`;
}

function renderAccounts(c){return `<div class="card"><div class="toolbar"><span class="muted">Plano inicial genérico. Adapte-o às necessidades de cada empresa.</span><span class="spacer"></span><button class="primary" data-action="new-account">+ Conta</button></div>${table(['Código','Nome','Grupo','Tipo','Natureza',''],[...c.accounts].sort(compare).map(a=>`<tr><td>${tint(a.kind,a.code)}</td><td style="padding-left:${10+Math.min(5,a.code.split('.').length-1)*14}px" class="${a.postable?'':'account-total'}">${accountName(a)}</td><td>${tint(a.kind,kinds[a.kind])}</td><td>${a.postable?'Analítica':'Sintética'}</td><td>${a.normal==='D'?'Devedora':'Credora'}</td><td><button class="small" data-account="${esc(a.id)}">Editar</button></td></tr>`).join(''))}</div>`;}
function renderTrial(c){const mv=movements(c,from,to);
const before=movements({...c,entries:c.entries.filter(e=>e.date<from)});let td=0,tc=0,op=0,end=0;const rows=c.accounts.filter(a=>a.postable).sort(compare).map(a=>{const p=raw(before[a.id]),d=mv[a.id].debit,cr=mv[a.id].credit,n=sum([p,d,-cr]);td=sum([td,d]);tc=sum([tc,cr]);op=sum([op,p]);end=sum([end,n]);exportRows.push([a.code,a.name,dec(Math.abs(p)),p>0?'D':p<0?'C':'',dec(d),dec(cr),dec(Math.abs(n)),n>0?'D':n<0?'C':'']);return `<tr><td>${tint(a.kind,a.code)}</td><td><button class="link" style="color:${kindColors[a.kind]}" data-ledger="${esc(a.id)}">${esc(a.name)}</button></td><td class="num">${debitCredit(p)}</td><td class="num">${money(d)}</td><td class="num">${money(cr)}</td><td class="num">${debitCredit(n)}</td></tr>`;}).join('');exportRows.unshift(['Código','Conta','Saldo anterior','D/C anterior','Débitos','Créditos','Saldo final','D/C final']);exportRows.push(['TOTAL','',dec(Math.abs(op)),op>=0?'D':'C',dec(td),dec(tc),dec(Math.abs(end)),end>=0?'D':'C']);return `<div class="notice">Saldos anteriores consideram todos os lançamentos antes de ${fmtDate(from)}. Selecione uma conta para abrir o razão.</div><div class="card">${table(['Código','Conta','Saldo anterior','Débitos','Créditos','Saldo final'],rows+`<tr class="total"><td colspan="2">Totais analíticos</td><td class="num">${debitCredit(op)}</td><td class="num">${money(td)}</td><td class="num">${money(tc)}</td><td class="num">${debitCredit(end)}</td></tr>`)}</div>`;}

function renderLedger(c){
 const a=c.accounts.find(a=>a.id===accountFilter);if(!a)return '<div class="card empty">Selecione uma conta analítica para consultar o razão.</div>';
 const entries=sortedEntries(c).filter(e=>e.date>=from&&e.date<=to&&e.lines.some(l=>l.account===a.id));
 const showDocument=entries.some(e=>String(e.reference||'').trim().length>0);
 const headers=['Data','Nº','Histórico','Contrapartida',...(showDocument?['Documento']:[]),'Débito','Crédito','Saldo'];
 let balance=raw(movements({...c,entries:c.entries.filter(e=>e.date<from)})[a.id]),td=0,tc=0;
 exportRows=[['Data','Lançamento','Histórico','Contrapartida',...(showDocument?['Documento']:[]),'Débito','Crédito','Saldo','D/C'],['','','Saldo anterior','',...(showDocument?['']:[]),'','',dec(Math.abs(balance)),balance>0?'D':balance<0?'C':'']];
 let rows=`<tr class="section-row"><td colspan="${headers.length-1}">Saldo anterior</td><td class="num">${debitCredit(balance)}</td></tr>`;
 for(const e of entries){for(const l of e.lines.filter(l=>l.account===a.id)){
  balance=sum([balance,l.debit,-l.credit]);td=sum([td,l.debit]);tc=sum([tc,l.credit]);const counterparts=counterpartAccounts(c,e,l);
  exportRows.push([fmtDate(e.date),e.number,e.memo,counterparts.map(a=>a.code).join(', '),...(showDocument?[e.reference||'']:[]),dec(l.debit),dec(l.credit),dec(Math.abs(balance)),balance>0?'D':balance<0?'C':'']);
  rows+=`<tr data-entry="${esc(e.id)}"><td>${fmtDate(e.date)}</td><td><button class="link" data-edit="${esc(e.id)}">#${e.number}</button></td><td class="wrap">${esc(e.memo)}</td><td class="wrap">${counterparts.map(a=>`<span title="${esc(a.name)}">${tint(a.kind,a.code)}</span>`).join(', ')}</td>${showDocument?`<td>${esc(e.reference)}</td>`:''}<td class="num">${l.debit?money(l.debit):'—'}</td><td class="num">${l.credit?money(l.credit):'—'}</td><td class="num">${debitCredit(balance)}</td></tr>`;
 }}
 rows+=`<tr class="total"><td colspan="${headers.length-3}">Movimento / saldo final</td><td class="num">${money(td)}</td><td class="num">${money(tc)}</td><td class="num">${debitCredit(balance)}</td></tr>`;
 return `<div class="card"><h2>${tint(a.kind,a.code)} — ${accountName(a)}</h2>${table(headers,rows)}<p class="muted">Selecione uma partida para editar o lançamento completo. Contrapartida lista as contas do lado oposto do mesmo lançamento; em lançamentos compostos, pode haver mais de uma.</p></div>`;
}

function renderJournal(c){exportRows=[['Data','Lançamento','Histórico','Documento','Código','Conta','Débito','Crédito']];let td=0,tc=0;let rows='';for(const e of sortedEntries(c).filter(e=>e.date>=from&&e.date<=to)){rows+=`<tr class="section-row" data-entry="${esc(e.id)}"><td>${fmtDate(e.date)}</td><td colspan="2"><button class="link" data-edit="${esc(e.id)}">#${e.number} · ${esc(e.memo)}</button></td><td colspan="2">${esc(e.reference)}</td></tr>`;for(const l of e.lines){const a=c.accounts.find(a=>a.id===l.account);td=sum([td,l.debit]);tc=sum([tc,l.credit]);exportRows.push([fmtDate(e.date),e.number,e.memo,e.reference||'',a.code,a.name,dec(l.debit),dec(l.credit)]);rows+=`<tr data-entry="${esc(e.id)}"><td></td><td>${tint(a.kind,a.code)}</td><td class="wrap">${accountName(a)}</td><td class="num">${l.debit?money(l.debit):'—'}</td><td class="num">${l.credit?money(l.credit):'—'}</td></tr>`;}}if(rows)rows+=`<tr class="total"><td colspan="3">Totais</td><td class="num">${money(td)}</td><td class="num">${money(tc)}</td></tr>`;exportRows.push(['','','TOTAL','','','',dec(td),dec(tc)]);return `<div class="card">${table(['Data','Código','Conta / histórico','Débito','Crédito'],rows)}</div>`;}
function aggregateRows(c,mv,kind){const as=c.accounts.filter(a=>a.kind===kind).sort(compare);return as.map(a=>{const ids=a.postable?[a.id]:c.accounts.filter(b=>b.postable&&b.code.startsWith(a.code+'.')).map(b=>b.id);const n=natural(a,sum(ids.map(id=>raw(mv[id]))));exportRows.push([a.code,a.name,a.postable?'Analítica':'Sintética',dec(n)]);return `<tr class="${a.postable?'':'section-row'}"><td>${tint(a.kind,a.code)}</td><td style="padding-left:${10+Math.min(5,a.code.split('.').length-1)*12}px">${a.postable?`<button class="link" style="color:${kindColors[a.kind]}" data-ledger="${esc(a.id)}">${esc(a.name)}</button>`:accountName(a)}</td><td class="num ${n<0?'bad':''}">${money(n)}</td></tr>`;}).join('');}
function renderBalance(c){const mv=movements(c,'',to);const total=k=>sum(c.accounts.filter(a=>a.postable&&a.kind===k).map(a=>natural(a,raw(mv[a.id]))));const asset=total('asset'),liab=total('liability'),equity=total('equity'),result=sum([total('revenue'),-total('expense')]);const other=sum([liab,equity,result]);exportRows=[['Código','Conta','Tipo','Valor']];let rows='';for(const k of ['asset','liability','equity']){rows+=`<tr class="total"><td colspan="2">${tint(k,kinds[k])}</td><td class="num">${money(total(k))}</td></tr>`;rows+=aggregateRows(c,mv,k);}rows+=`<tr><td></td><td>Resultado ainda não transferido ao patrimônio líquido</td><td class="num">${money(result)}</td></tr><tr class="total"><td colspan="2">Total do ativo</td><td class="num">${money(asset)}</td></tr><tr class="total"><td colspan="2">Total do passivo + patrimônio líquido + resultado</td><td class="num">${money(other)}</td></tr>`;exportRows.push(['','Resultado não transferido','',dec(result)],['','Total do ativo','',dec(asset)],['','Total passivo + PL + resultado','',dec(other)]);return `<div class="notice">Posição acumulada até ${fmtDate(to)}. O campo “De” não limita os saldos do balanço. Contas sintéticas são subtotais; não devem ser somadas novamente. Resultado pendente de encerramento é apresentado separadamente. Clique nas contas analíticas para consultar o razão acumulado.</div><div class="card">${table(['Código','Conta','Valor'],rows)}<p class="${asset===other?'good':'bad'}">${asset===other?'✓ Balanço equilibrado.':'Balanço com diferença: '+money(asset-other)}</p></div>`;}
function renderIncome(c){const mv=movements(c,from,to,true);const revenue=sum(c.accounts.filter(a=>a.postable&&a.kind==='revenue').map(a=>-raw(mv[a.id]))),expense=sum(c.accounts.filter(a=>a.postable&&a.kind==='expense').map(a=>raw(mv[a.id]))),result=sum([revenue,-expense]);exportRows=[['Código','Conta','Tipo','Valor']];let rows=aggregateRows(c,mv,'revenue');rows+=`<tr class="total"><td colspan="2">Total de receitas, líquido das deduções</td><td class="num">${money(revenue)}</td></tr>`;rows+=aggregateRows(c,mv,'expense');rows+=`<tr class="total"><td colspan="2">Total de despesas e custos</td><td class="num">${money(expense)}</td></tr><tr class="total"><td colspan="2">${result>=0?'Lucro':'Prejuízo'} do período</td><td class="num ${result<0?'bad':'good'}">${money(result)}</td></tr>`;exportRows.push(['','Total de receitas','',dec(revenue)],['','Total de despesas e custos','',dec(expense)],['','Resultado do período','',dec(result)]);return `<div class="notice">DRE básica por grupo de contas: receitas menos custos e despesas. Partidas marcadas como encerramento são excluídas. Saldos negativos nas receitas representam deduções ou ajustes. Clique em uma conta para examinar suas partidas no razão.</div><div class="card">${table(['Código','Conta','Valor'],rows)}</div>`;}
function renderSettings(c){return `<div class="grid"><div class="card"><h2>Backup e restauração</h2><p>O backup inclui todas as empresas, contas e lançamentos. A restauração substitui todos os dados deste navegador após confirmação.</p><div class="inline"><button class="primary" data-action="backup">Exportar backup JSON</button>${localStorage.getItem(KEY+'.antes-plano-v2')?'<button data-action="legacy-backup">Backup anterior à atualização</button>':''}<button data-action="restore">Restaurar backup JSON</button></div><p class="muted">O navegador não sincroniza dados entre computadores, perfis, navegadores ou cópias do HTML. No modo privado, os dados podem ser apagados ao fechar a janela. Mantenha o HTML no mesmo local e faça backup antes de movê-lo.</p></div><div class="card"><h2>Empresa atual</h2><p><strong>${esc(c.name)}</strong><br>${esc(c.document||'Sem CNPJ informado')}</p><div class="inline"><button data-action="edit-company">Editar cadastro</button><button class="danger" data-action="delete-company">Excluir empresa</button></div><p class="muted">${c.accounts.length} contas · ${c.entries.length} lançamentos</p></div></div><div class="card"><h2>Encerramento do resultado</h2><p>Gere um lançamento automático em 31/12 para zerar receitas e despesas e transferir o resultado ao patrimônio líquido. Se alterar partidas anteriores, recalcule os encerramentos afetados. O encerramento não bloqueia a edição dos lançamentos.</p><div class="inline"><button data-action="closing">Encerrar exercício</button><button data-action="recalc" ${c.entries.some(e=>e.closing)?'':'disabled'}>Recalcular encerramentos</button></div></div><div class="notice">Ferramenta básica para escrituração e relatórios gerenciais contábeis. Não gera obrigações fiscais, SPED, autenticação de livros ou demonstrativos regulatórios completos. Não há conexão com serviços externos.</div>`;}
function restore(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const file=input.files[0];if(!file)return;if(file.size>30*1024*1024)throw Error('Arquivo muito grande. Limite: 30 MB.');const next=migrateDB(JSON.parse(await file.text()));if(!confirm(`Restaurar ${next.companies.length} empresa(s)? Todos os dados atuais serão substituídos. Faça backup antes de continuar.`))return;commit(next,true);entryDrafts.clear();accountFilter='';search='';render();toast('Backup restaurado e validado.');}catch(e){showError('Restauração não realizada: '+e.message);}};input.click();}
function csv(){if(!exportRows.length){toast('Não há relatório para exportar.');return;}const cell=v=>{let s=String(v??'');if((/^\s*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))&&!/^-\d+(?:\.\d{3})*,\d{2}$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};download(`fly-${tab}-${today()}.csv`,'\uFEFF'+exportRows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function applyPeriod(){const f=document.querySelector('#from').value,t=document.querySelector('#to').value;if(!validDate(f)||!validDate(t)||f>t)throw Error('Informe um período válido: a data inicial deve ser anterior ou igual à final.');from=f;to=t;render();}
function bindMain(){document.querySelector('#main').onclick=e=>{const b=e.target.closest('[data-action],[data-entry],[data-edit],[data-account],[data-ledger]');if(!b)return;safe(()=>{if(b.dataset.edit||b.dataset.entry){entryDialog(b.dataset.edit||b.dataset.entry);return;}if(b.dataset.account){accountDialog(b.dataset.account);return;}if(b.dataset.ledger){accountFilter=b.dataset.ledger;if(tab==='balance')from='1900-01-01';tab='ledger';render();return;}switch(b.dataset.action){case'new-company':companyDialog();break;case'new-entry':entryDialog();break;case'new-account':accountDialog();break;case'edit-company':companyDialog(true);break;case'closing':closingDialog();break;case'recalc':recalc();break;case'backup':backup();break;case'legacy-backup':download('fly-antes-plano-v2.json',localStorage.getItem(KEY+'.antes-plano-v2'),'application/json');break;case'restore':restore();break;case'csv':csv();break;case'apply':applyPeriod();break;case'search':search=document.querySelector('#search').value;render();break;case'delete-company':if(confirm(`Excluir a empresa ${company().name} e todos os seus dados? Esta ação é permanente.`)){mutate((next,c)=>{next.companies=next.companies.filter(x=>x.id!==c.id);next.active=next.companies[0]?.id||null;});accountFilter='';}break;}});};const sel=document.querySelector('#ledgerAccount');if(sel)sel.onchange=e=>{accountFilter=e.target.value;render();};const s=document.querySelector('#search');if(s)s.onkeydown=e=>{if(e.key==='Enter'){search=s.value;render();}};}
document.querySelector('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();}};
document.querySelector('#companySelect').onchange=e=>safe(()=>{const id=e.target.value;mutate(next=>next.active=id);accountFilter='';search='';render();});
document.querySelector('#newCompany').onclick=()=>companyDialog();document.querySelector('#backupTop').onclick=()=>safe(backup);
document.querySelector('#dialog').onclick=e=>{if(e.target.closest('[data-action="dismiss"]'))dismiss();};document.querySelector('#dialog').addEventListener('cancel',e=>{e.preventDefault();dismiss();});
window.addEventListener('storage',e=>{if(e.key===KEY){loadError='Os dados foram alterados em outra aba. Recarregue esta página antes de continuar para evitar sobrescrever alterações.';document.querySelectorAll('button').forEach(b=>b.disabled=true);const p=document.querySelector('#pageError');if(p){p.hidden=false;p.textContent=loadError;}}});
render();
</script>
</body>
</html>
