<body>
<header><div class="brand">Fly<span id="appVersion" class="version-badge" aria-label="Versão do programa"></span><span>Contabilidade • local e offline</span></div><div class="header-actions"><label style="color:#c4d2e6">Empresa<select id="companySelect" aria-label="Empresa ativa"></select></label><button id="newCompany">+ Empresa</button><button id="backupTop">Backup JSON</button></div></header>
<nav id="nav" aria-label="Navegação principal"></nav>
<main id="main"></main><div class="footer"><span id="storageStatus" role="status"></span> Os dados ficam neste navegador. Faça backups regularmente e antes de limpar dados de navegação ou trocar de computador.</div>
<dialog id="dialog"><div id="dialogContent"></div></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='fly.contabilidade.v1';
const APP_VERSION='1.5.0';
const money=n=>((n||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dec=n=>((n||0)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtDate=s=>s.split('-').reverse().join('/');
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&s.slice(0,4)>='1900'&&s.slice(0,4)<='9999'&&!isNaN(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s;
function cents(s){s=String(s).trim();if(!s)return 0;if(!/^\d+(?:\.\d{3})*(?:,\d{1,2})?$/.test(s))throw Error('Use valores como 1.234,56, sem sinal ou símbolo de moeda.');const parts=s.replace(/\./g,'').split(',');const v=Number(parts[0])*100+Number((parts[1]||'').padEnd(2,'0'));if(!Number.isSafeInteger(v)||v>1e14)throw Error('Valor fora do limite permitido.');return v;}
const kinds={asset:'Ativo',funding:'Passivo e PL',liability:'Passivo',equity:'Patrimônio líquido',revenue:'Receitas',expense:'Despesas'};
const kindColors={asset:'#245FA5',funding:'#B65B22',liability:'#B65B22',equity:'#8A6818',revenue:'#247A46',expense:'#BB3944'};
const tint=(kind,text)=>`<span style="color:${kindColors[kind]}">${esc(text)}</span>`;
const accountName=a=>a.kind==='funding'?`${tint('liability','Passivo')} e ${tint('equity','Patrimônio líquido')}`:tint(a.kind,a.name);
const normalizeQuery=s=>s.replace(/[—–]/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');
function matchingAccounts(accounts,query){const q=normalizeQuery(query).trim(),terms=q.split(/\s+/).filter(Boolean),rank=a=>a.code===q?0:a.code.startsWith(q)?1:normalizeQuery(a.name).startsWith(q)?2:3;return terms.length?accounts.filter(a=>a.postable&&terms.every(t=>normalizeQuery(a.code+' '+a.name).includes(t))).sort((a,b)=>rank(a)-rank(b)||compare(a,b)):[];}
function counterpartAccounts(c,e,line){const ids=new Set(e.lines.filter(other=>line.debit>0?other.credit>0:other.debit>0).map(other=>other.account));return c.accounts.filter(a=>ids.has(a.id)).sort(compare);}

function closingDialog(){const year=Number(to.slice(0,4)),c=company();openDialog('Encerrar resultado do exercício',`<div class="notice">A rotina zera os saldos de receitas e despesas até 31/12 e transfere o resultado para uma conta do patrimônio líquido. A DRE ignora as partidas de encerramento. Não é necessário usar uma conta transitória de apuração.</div><div class="grid"><label>Exercício<input type="number" min="1900" max="9999" name="year" value="${year}" required></label><label>Conta de destino do resultado<select name="target" required>${accountOptions(c.accounts.find(a=>a.kind==='equity'&&a.name==='Lucros ou prejuízos acumulados')?.id,a=>a.kind==='equity')}</select></label></div><p class="muted">Encerre os exercícios em ordem. Se houver alteração posterior dos lançamentos, o sistema sinaliza os encerramentos afetados; recalcule-os para atualizar os saldos.</p>`,`<button class="primary">Gerar encerramento</button>`);document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();safe(async()=>{const f=new FormData(e.target),y=Number(f.get('year')),target=f.get('target'),date=`${y}-12-31`;if(!validDate(date))throw Error('Exercício inválido.');if(c.entries.some(e=>e.closing&&e.year===y))throw Error('Esse exercício já possui encerramento. Use Recalcular encerramentos.');if(c.entries.some(e=>e.closing&&e.year>y))throw Error('Exclua os encerramentos posteriores ou recalcule-os após encerrar este exercício.');if(!c.accounts.some(a=>a.id===target&&a.kind==='equity'&&a.postable))throw Error('Escolha uma conta analítica do patrimônio líquido.');const lines=closeLines(c,date,target);if(!lines.length)throw Error('Não há saldos de resultado a encerrar.');const entry={id:uid(),number:Math.max(0,...c.entries.map(e=>e.number))+1,date,reference:'ENC-'+y,memo:`Encerramento do resultado — exercício ${y}`,lines,closing:true,year:y,target,stale:false};validateEntry(entry,c);await mutate((_,co)=>co.entries.push(entry));finishDialog();toast('Encerramento gerado.');});};}

}

function renderAccounts(c){return `<div class="card"><div class="toolbar"><span class="muted">Plano inicial genérico. Adapte-o às necessidades de cada empresa.</span><span class="spacer"></span><button class="primary" data-action="new-account">+ Conta</button></div>${table(['Código','Nome','Grupo','Tipo','Natureza',''],[...c.accounts].sort(compare).map(a=>`<tr><td>${tint(a.kind,a.code)}</td><td style="padding-left:${10+Math.min(5,a.code.split('.').length-1)*14}px" class="${a.postable?'':'account-total'}">${accountName(a)}</td><td>${tint(a.kind,kinds[a.kind])}</td><td>${a.postable?'Analítica':'Sintética'}</td><td>${a.normal==='D'?'Devedora':'Credora'}</td><td><button class="small" data-account="${esc(a.id)}">Editar</button></td></tr>`).join(''))}</div>`;}
function renderTrial(c){
 const {rows,totals}=trialBalances(c,from,to,showSynthetic);
 exportRows=[['Código','Conta','Tipo','Saldo anterior','D/C anterior','Débitos','Créditos','Saldo final','D/C final']];

  exportRows.push([a.code,a.name,a.postable?'Analítica':'Sintética',dec(Math.abs(p)),p>0?'D':p<0?'C':'',dec(d),dec(cr),dec(Math.abs(n)),n>0?'D':n<0?'C':'']);
  if(showSynthetic&&!accountVisible(a.code,getCollapsed('trial')))return '';

function renderLedger(c){
 const a=c.accounts.find(a=>a.id===accountFilter);if(!a)return '<div class="card empty">Selecione uma conta analítica para consultar o razão.</div>';
 const entries=sortedEntries(c).filter(e=>e.date>=from&&e.date<=to&&e.lines.some(l=>l.account===a.id));
 const showDocument=entries.some(e=>String(e.reference||'').trim().length>0);
 const headers=['Data','Nº','Histórico','Contrapartida',...(showDocument?['Documento']:[]),'Débito','Crédito','Saldo'];
 let balance=raw(movements({...c,entries:c.entries.filter(e=>e.date<from)})[a.id]),td=0,tc=0;
 exportRows=[['Data','Lançamento','Histórico','Contrapartida',...(showDocument?['Documento']:[]),'Débito','Crédito','Saldo','D/C'],['','','Saldo anterior','',...(showDocument?['']:[]),'','',dec(Math.abs(balance)),balance>0?'D':balance<0?'C':'']];
 let rows=`<tr class="section-row"><td colspan="${headers.length-1}">Saldo anterior</td><td class="num">${debitCredit(balance)}</td></tr>`;
 for(const e of entries){for(const l of e.lines.filter(l=>l.account===a.id)){
  balance=sum([balance,l.debit,-l.credit]);td=sum([td,l.debit]);tc=sum([tc,l.credit]);const counterparts=counterpartAccounts(c,e,l);
  exportRows.push([fmtDate(e.date),e.number,e.memo,counterparts.map(a=>a.code).join(', '),...(showDocument?[e.reference||'']:[]),dec(l.debit),dec(l.credit),dec(Math.abs(balance)),balance>0?'D':balance<0?'C':'']);
  rows+=`<tr data-entry="${esc(e.id)}"><td>${fmtDate(e.date)}</td><td><button class="link" data-edit="${esc(e.id)}">#${e.number}</button></td><td class="wrap">${esc(e.memo)}</td><td class="wrap">${counterparts.map(a=>`<span title="${esc(a.name)}">${tint(a.kind,a.code)}</span>`).join(', ')}</td>${showDocument?`<td>${esc(e.reference)}</td>`:''}<td class="num">${l.debit?money(l.debit):'—'}</td><td class="num">${l.credit?money(l.credit):'—'}</td><td class="num">${debitCredit(balance)}</td></tr>`;
 }}
 rows+=`<tr class="total"><td colspan="${headers.length-3}">Movimento / saldo final</td><td class="num">${money(td)}</td><td class="num">${money(tc)}</td><td class="num">${debitCredit(balance)}</td></tr>`;
 return `<div class="card"><h2>${tint(a.kind,a.code)} — ${accountName(a)}</h2>${table(headers,rows)}<p class="muted">Selecione uma partida para editar o lançamento completo. Contrapartida lista as contas do lado oposto do mesmo lançamento; em lançamentos compostos, pode haver mais de uma.</p></div>`;
}

function renderJournal(c){exportRows=[['Data','Lançamento','Histórico','Documento','Código','Conta','Débito','Crédito']];let td=0,tc=0;let rows='';for(const e of sortedEntries(c).filter(e=>e.date>=from&&e.date<=to)){rows+=`<tr class="section-row" data-entry="${esc(e.id)}"><td>${fmtDate(e.date)}</td><td colspan="2"><button class="link" data-edit="${esc(e.id)}">#${e.number} · ${esc(e.memo)}</button></td><td colspan="2">${esc(e.reference)}</td></tr>`;for(const l of e.lines){const a=c.accounts.find(a=>a.id===l.account);td=sum([td,l.debit]);tc=sum([tc,l.credit]);exportRows.push([fmtDate(e.date),e.number,e.memo,e.reference||'',a.code,a.name,dec(l.debit),dec(l.credit)]);rows+=`<tr data-entry="${esc(e.id)}"><td></td><td>${tint(a.kind,a.code)}</td><td class="wrap">${accountName(a)}</td><td class="num">${l.debit?money(l.debit):'—'}</td><td class="num">${l.credit?money(l.credit):'—'}</td></tr>`;}}if(rows)rows+=`<tr class="total"><td colspan="3">Totais</td><td class="num">${money(td)}</td><td class="num">${money(tc)}</td></tr>`;exportRows.push(['','','TOTAL','','','',dec(td),dec(tc)]);return `<div class="card">${table(['Data','Código','Conta / histórico','Débito','Crédito'],rows)}</div>`;}
function statementRows(c,mv,accounts,report){
 const analytical=c.accounts.filter(a=>a.postable),folded=getCollapsed(report);
 return [...accounts].sort(compare).map(a=>{
  const ids=a.postable?[a.id]:analytical.filter(b=>b.code.startsWith(a.code+'.')).map(b=>b.id),n=natural(a,sum(ids.map(id=>raw(mv[id]))));
  exportRows.push([a.code,a.name,a.postable?'Analítica':'Sintética',dec(n)]);
  if(!accountVisible(a.code,folded))return '';
  return `<tr ${foldAttributes(a,report)}><td>${tint(a.kind,a.code)}</td><td style="padding-left:${10+Math.min(5,a.code.split('.').length-1)*12}px">${foldName(a,report)}</td><td class="num ${n<0?'bad':''}">${money(n)}</td></tr>`;
 }).join('');
}
function aggregateRows(c,mv,kind){return statementRows(c,mv,c.accounts.filter(a=>a.kind===kind),'income');}
function renderBalance(c){
 const mv=movements(c,'',to),total=k=>sum(c.accounts.filter(a=>a.postable&&a.kind===k).map(a=>natural(a,raw(mv[a.id])))),asset=total('asset'),liab=total('liability'),equity=total('equity'),result=sum([total('revenue'),-total('expense')]),other=sum([liab,equity,result]);
 exportRows=[['Código','Conta','Tipo','Valor']];let rows=statementRows(c,mv,c.accounts.filter(a=>['asset','funding','liability','equity'].includes(a.kind)),'balance');
 rows+=`<tr><td></td><td>Resultado ainda não transferido ao patrimônio líquido</td><td class="num">${money(result)}</td></tr><tr class="total"><td colspan="2">Total do ativo</td><td class="num">${money(asset)}</td></tr><tr class="total"><td colspan="2">Total do passivo + patrimônio líquido + resultado</td><td class="num">${money(other)}</td></tr>`;
 exportRows.push(['','Resultado não transferido','',dec(result)],['','Total do ativo','',dec(asset)],['','Total passivo + PL + resultado','',dec(other)]);
 return `<div class="notice">Posição acumulada até ${fmtDate(to)}. O campo “De” não limita os saldos do balanço. Clique na linha sintética para recolher/expandir e na conta analítica para consultar o razão. O recolhimento altera somente a tela; o CSV mantém os detalhes e os totais.</div><div class="card">${table(['Código','Conta','Valor'],rows)}<p class="${asset===other?'good':'bad'}">${asset===other?'✓ Balanço equilibrado.':'Balanço com diferença: '+money(asset-other)}</p></div>`;

function renderIncome(c){const mv=movements(c,from,to,true);const revenue=sum(c.accounts.filter(a=>a.postable&&a.kind==='revenue').map(a=>-raw(mv[a.id]))),expense=sum(c.accounts.filter(a=>a.postable&&a.kind==='expense').map(a=>raw(mv[a.id]))),result=sum([revenue,-expense]);exportRows=[['Código','Conta','Tipo','Valor']];let rows=aggregateRows(c,mv,'revenue');rows+=`<tr class="total"><td colspan="2">Total de receitas, líquido das deduções</td><td class="num">${money(revenue)}</td></tr>`;rows+=aggregateRows(c,mv,'expense');rows+=`<tr class="total"><td colspan="2">Total de despesas e custos</td><td class="num">${money(expense)}</td></tr><tr class="total"><td colspan="2">${result>=0?'Lucro':'Prejuízo'} do período</td><td class="num ${result<0?'bad':'good'}">${money(result)}</td></tr>`;exportRows.push(['','Total de receitas','',dec(revenue)],['','Total de despesas e custos','',dec(expense)],['','Resultado do período','',dec(result)]);return `<div class="notice">Clique na linha sintética para recolher/expandir. O CSV mantém os detalhes. DRE básica por grupo de contas: receitas menos custos e despesas. Partidas marcadas como encerramento são excluídas. Saldos negativos nas receitas representam deduções ou ajustes. Clique em uma conta para examinar suas partidas no razão.</div><div class="card">${table(['Código','Conta','Valor'],rows)}</div>`;}
const statementViews=new Map();

function statementSettingsDialog(){const c=company(),config=statementConfig(c),eligible=c.accounts.filter(a=>['asset','liability','equity','funding'].includes(a.kind)).sort(compare);openDialog('Classificação das demonstrações',`<p class="muted">Selecione as contas que representam cada conjunto. Uma classificação específica prevalece sobre a de sua sintética; cada analítica é contada uma única vez. “Herdar” usa a classificação da conta superior. As sugestões iniciais devem ser revisadas para o seu plano.</p><div class="table-wrap"><table><thead><tr><th>Conta</th><th>DFC</th><th>Conjunto para índices</th></tr></thead><tbody>${eligible.map(a=>{const r=config.rules.find(r=>r.account===a.id)||{};return `<tr data-statement-rule="${esc(a.id)}"><td class="wrap">${esc(a.code+' '+a.name)}</td><td><select class="dfc-rule" aria-label="DFC ${esc(a.code)}"><option value="">Herdar / sem classificação</option>${Object.entries(dfcLabels).filter(([k])=>k!=='cash'||a.kind==='asset').map(([k,n])=>`<option value="${k}" ${r.dfc===k?'selected':''}>${n}</option>`).join('')}</select></td><td><select class="index-rule" aria-label="Índices ${esc(a.code)}"><option value="">Herdar / sem classificação</option>${Object.entries(indexLabels).filter(([k])=>a.kind==='asset'?['currentAssets','longReceivables'].includes(k):a.kind==='liability'?['currentLiabilities','nonCurrentLiabilities'].includes(k):false).map(([k,n])=>`<option value="${k}" ${r.index===k?'selected':''}>${n}</option>`).join('')}</select></td></tr>`;}).join('')}</tbody></table></div><h3>Colunas da DMPL</h3><p class="muted">Escolha contas do PL sem sobrepor uma sintética e suas descendentes. O resultado não transferido é apresentado em coluna própria.</p><div class="statement-columns">${c.accounts.filter(a=>a.kind==='equity').sort(compare).map(a=>`<label><input type="checkbox" name="equityColumn" value="${esc(a.id)}" ${config.columns.includes(a.id)?'checked':''}>${esc(a.code+' '+a.name)}</label>`).join('')}</div><label style="margin-top:12px">Coluna que recebe a transferência do resultado<select name="resultColumn"><option value="">Sem transferência automática</option>${c.accounts.filter(a=>a.kind==='equity').sort(compare).map(a=>`<option value="${esc(a.id)}" ${config.resultColumn===a.id?'selected':''}>${esc(a.code+' '+a.name)}</option>`).join('')}</select></label>`,`<button class="primary">Salvar classificação</button>`);document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();safe(async()=>{const f=new FormData(e.target),rules=[...e.target.querySelectorAll('[data-statement-rule]')].map(row=>({account:row.dataset.statementRule,dfc:row.querySelector('.dfc-rule').value,index:row.querySelector('.index-rule').value})).filter(r=>r.dfc||r.index),next={...config,rules,columns:f.getAll('equityColumn'),resultColumn:f.get('resultColumn'),reviewed:true};validateStatements({...c,statements:next});await saveStatementConfig(next,'Classificação das demonstrações salva.');});};}

function statementEquityDialog(){const c=company(),config=statementConfig(c),period=statementPeriod(config),equity=equityStatement(c,config,from,to,period);let rows=structuredClone(period.movements);openDialog('Movimentos complementares da DMPL','<p class="muted">Informe os movimentos que não são identificados apenas pelos saldos: aportes, distribuição de lucros e transferências. Positivo aumenta a coluna; negativo diminui. Esses dados explicam a variação e não alteram o balanço. A diferença de conciliação permanece visível até ser explicada.</p><div id="equityEditor"></div>',`<button class="primary">Salvar movimentos</button>`);const host=document.querySelector('#equityEditor');const capture=()=>{rows=[...host.querySelectorAll('[data-equity-movement]')].map(el=>({label:el.querySelector('.movement-label').value.trim(),values:Object.fromEntries([...el.querySelectorAll('[data-equity-value]')].map(input=>[input.dataset.equityValue,signedCents(input.value)]))}));};const draw=()=>{host.innerHTML=rows.map((r,i)=>`<section data-equity-movement="${i}" class="note-edit"><label>Descrição<input class="movement-label" required maxlength="2000" value="${esc(r.label)}"></label><div class="grid">${equity.columns.map(a=>`<label>${esc(a.label)}<input inputmode="decimal" data-equity-value="${esc(a.id)}" value="${esc(dec(r.values[a.id]||0))}"></label>`).join('')}</div><button type="button" class="danger" data-remove-movement="${i}">Excluir movimento</button></section>`).join('')+'<button type="button" id="addEquityMovement">+ Movimento</button>';host.querySelector('#addEquityMovement').onclick=()=>safe(()=>{capture();rows.push({label:'',values:{}});dialogDirty=true;draw();});host.querySelectorAll('[data-remove-movement]').forEach(b=>b.onclick=()=>safe(()=>{capture();rows.splice(Number(b.dataset.removeMovement),1);dialogDirty=true;draw();}));};draw();document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();safe(async()=>{capture();await saveStatementConfig({...config,perio function documentAmount(n){return n===0?'—':n<0?'('+dec(-n)+')':dec(n);}
function documentTable(headers,rows,cls=''){return `<table class="document-table ${cls}"><thead><tr>${headers.map((h,i)=>`<th class="${i?'num':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;}
function documentRow(label,values,cls=''){exportRows.push([label,...values.map(dec)]);return `<tr class="${cls}"><td>${esc(label)}</td>${values.map(n=>`<td class="num">${documentAmount(n)}</td>`).join('')}</tr>`;}
function documentBalance(c,current,previous,previousLabel,currentLabel){const equityRoots=c.accounts.filter(a=>a.kind==='equity'&&!c.accounts.some(b=>b.kind==='equity'&&a.code.startsWith(b.code+'.'))).sort(compare),resultAccount=c.accounts.find(a=>a.id===statementConfig(c).resultColumn),pendingRoot=equityRoots.find(a=>resultAccount&&(a.id===resultAccount.id||resultAccount.code.startsWith(a.code+'.')))||equityRoots[0];const heads=['',...(previous?[previousLabel]:[]),currentLabel],sides=[['ATIVO',['asset']],['PASSIVO E PATRIMÔNIO LÍQUIDO',['funding','liability','equity']]];const columns=sides.map(([title,kinds])=>{let rows='';for(const a of c.accounts.filter(a=>kinds.includes(a.kind)&&a.kind!=='funding'&&!(a.kind==='asset'&&!a.postable&&a.code==='1')).sort(compare)){const includePending=a.id===pendingRoot?.id&&!a.postable;const values=[...(previous?[sum([statementSubtotal(c,previous.values,a),includePending?previous.pending:0])]:[]),sum([statementSubtotal(c,current.values,a),includePending?current.pending:0])];if(!values.some(Boolean))continue;rows+=documentRow((a.postable?'　':'')+a.name,values,a.postable?'detail':'subtotal');}if(kinds.includes('equity')&&(current.pending||previous?.pending))rows+=documentRow('Resultado não transferido ao PL',[...(previous?[previous.pending]:[]),current.pending]);const totals=kinds.includes('asset')?[...(previous?[previous.asset]:[]),current.asset]:[...(previous?[sum([previous.liability,previous.equity,previous.pending])]:[]),sum([current.liability,current.equity,current.pending])];return `<section class="balance-half"><h3>${title}</h3>${documentTable(heads,rows)}${documentTable(heads,documentRow(kinds.includes('asset')?'TOTAL DO ATIVO':'TOTAL DO PASSIVO E PL',totals,'grand-total'),'balance-total')}</section>`;});return `<div class="balance-spread">${columns.join('')}</div>${current.asset!==sum([current.liability,current.equity,current.pending])?'<p class="document-warning">Balanço com diferença.</p>':''}`;}
function documentIncome(c,from,to,previousFrom,previousTo,hasPrevious){const current=statementProfit(c,from,to),previous=hasPrevious?statementProfit(c,previousFrom,previousTo):null;let rows='';for(const kind of ['revenue','expense']){for(const a of c.accounts.filter(a=>a.kind===kind).sort(compare)){const values=[...(previous?[statementSubtotal(c,previous.values,a)]:[]),statementSubtotal(c,current.values,a)];if(values.some(Boolean))rows+=documentRow((a.postable?'　':'')+a.name,values,a.postable?'detail':'subtotal');}rows+=documentRow(kind==='revenue'?'RECEITAS LÍQUIDAS':'DESPESAS E CUSTOS',[...(previous?[previous[kind==='revenue'?'revenue':'expense']]:[]),current[kind==='revenue'?'revenue':'expense']],'subtotal');}rows+=documentRow('RESULTADO LÍQUIDO DO PERÍODO',[...(previous?[previous.profit]:[]),current.profit],'grand-total');return documentTable(['',...(previous?[fmtDate(previousTo)]:[]),fmtDate(to)],rows);}
function documentCash(c,config,from,to,prevFrom,prevTo,hasPrevious){const current=cashStatement(c,config,from,to),previous=hasPrevious?cashStatement(c,config,prevFrom,prevTo):null,vals=fn=>[...(previous?[fn(previous)]:[]),fn(current)];let rows=documentRow('Lucro / prejuízo líquido do período',vals(d=>d.profit),'subtotal');for(const [kind,title] of [['operating','ATIVIDADES OPERACIONAIS'],['investing','ATIVIDADES DE INVESTIMENTO'],['financing','ATIVIDADES DE FINANCIAMENTO']]){rows+=`<tr class="document-section"><td colspan="${previous?3:2}">${title}</td></tr>`;const ids=new Set([...current.groups[kind].map(r=>r.id),...(previous?.groups[kind]||[]).map(r=>r.id)]);for(const id of ids){const row=current.groups[kind].find(r=>r.id===id)||previous.groups[kind].find(r=>r.id===id);const v=vals(d=>d.groups[kind].find(r=>r.id===id)?.amount||0);if(v.some(Boolean))rows+=documentRow(row.label,v);}rows+=documentRow('Caixa líquido — '+title.toLowerCase(),vals(d=>d[kind]),'subtotal');}for(const [label,key] of [['Variação de caixa e equivalentes','flow'],['Disponíveis no início','initial'],['Disponíveis no fim','final'],['Diferença de conciliação','difference']])rows+=documentRow(label,vals(d=>d[key]),'grand-total');const missing=[...new Map([...current.unmapped,...(previous?.unmapped||[])].map(a=>[a.id,a])).values()];const hasCash=c.accounts.some(a=>a.postable&&ruleValue(c,config,a,'dfc')==='cash');const balanced=hasCash&&!current.difference&&!previous?.difference&&!missing.length&&config.reviewed;return documentTable(['',...(previous?[fmtDate(prevTo)]:[]),fmtDate(to)],rows)+`<p class="document-check ${balanced?'good':'bad'}" role="status">${balanced?'Conciliação dos disponíveis: conferida.':'Pendente de revisão.'}${!hasCash?' Selecione as contas de disponíveis.':''}${!config.reviewed?' Revise e salve a classificação das contas.':''}${missing.length?' Contas sem classificação: '+esc(missing.map(a=>a.code+' '+a.name).join('; '))+'.':''}</p><p class="document-method">Método por variação dos saldos do balanço, conforme a configuração da empresa, sem análise das contrapartidas. O resultado é apresentado uma única vez, nas atividades operacionais; sua parcela é retirada da variação do PL em financiamento.</p>`;}
function documentEquity(c,config,period){const d=equityStatement(c,config,from,to,period);const row=(label,values,cls='')=>documentRow(label,[...values,sum(values)],cls);let rows=row('SALDOS INICIAIS',d.first,'subtotal')+row('Resultado do período',d.result)+row('Transferência do resultado ao PL',d.transfer);for(const r of d.movements)rows+=row(r.label,r.values);rows+=row('SALDOS CALCULADOS',d.computed,'subtotal')+row('SALDOS FINAIS DO BALANÇO',d.last,'grand-total')+row('Diferença a explicar',d.difference,'subtotal');const missing=d.missingEquity;const balanced=!d.difference.some(Boolean)&&!missing.length&&config.reviewed;return documentTable(['Movimento',...d.columns.map(a=>a.label),'Total'],rows,'dmpl-table')+`<p class="document-check ${balanced?'good':'bad'}" role="status">${balanced?'DMPL conciliada com o balanço.':'DMPL pendente de revisão.'}${missing.length?' PL sem coluna: '+esc(missing.map(a=>a.code).join(', '))+'.':''}</p>`;}
function documentRatios(c,config,date,previousDate,hasPrevious){const current=statementRatios(c,config,date),previous=hasPrevious?statementRatios(c,config,previousDate):null,format=(v,p)=>v===null?'Não calculável':(v*(p?100:1)).toLocaleString('pt-BR',{minimumFractionDigits:4,maximumFractionDigits:4})+(p?'%':'');let rows='';current.rows.forEach(([label,value,formula,percent],i)=>{const values=[...(previous?[format(previous.rows[i][1],percent)]:[]),format(value,percent)];exportRows.push([label,formula,...values]);rows+=`<tr><td>${esc(label)}<small>${esc(formula)}</small></td>${values.map(v=>`<td class="num">${v}</td>`).join('')}</tr>`;});return documentTable(['Índice',...(previous?[fmtDate(previousDate)]:[]),fmtDate(date)],rows)+`<p class="document-method">Passivo exigível = passivo circulante + não circulante, sem PL. Liquidez de recursos próprios é o inverso da solvência geral, conforme definido para este módulo. Divisão por zero é apresentada como não calculável.${!config.reviewed?' Revise a classificação das contas antes de utilizar os índices.':''}</p>`;}
function renderStatements(c){const view=statementView(),config=statementConfig(c),period=statementPeriod(config),hasPrevious=c.entries.some(e=>e.date<=view.previousTo),previous=hasPrevious?statementPosition(c,view.previousTo):null,current=statementPosition(c,to),title=period.titles?.[view.report]||statementTypes[view.report];exportRows=[[title],['Período atual',from,to],...(hasPrevious?[['Período anterior',view.previousFrom,view.previousTo]]:[])];let content='';if(view.report==='balance')content=documentBalance(c,current,previous,fmtDate(view.previousTo),fmtDate(to));if(view.report==='income')content=documentIncome(c,from,to,view.previousFrom,view.previousTo,hasPrevious);if(view.report==='cash')content=documentCash(c,config,from,to,view.previousFrom,view.previousTo,hasPrevious);if(view.report==='equity')content=documentEquity(c,config,period);if(view.report==='ratios')content=documentRatios(c,config,to,view.previousTo,hasPrevious);if(view.report==='notes')content=period.notes.map((n,i)=>{exportRows.push([i+1,n.title]);return `<section class="document-note"><h3>${i+1}. ${esc(n.title)}</h3>${n.paragraphs.map((p,j)=>{exportRows.push([`${i+1}.${j+1}`,p]);return `<p><span>${i+1}.${j+1}.</span> ${esc(p)}</p>`;}).join('')}</section>`;}).join('')||'<p class="document-empty">Nenhuma nota explicativa cadastrada para este período.</p>';
 const h=config.header,line=parts=>parts.filter(Boolean).map(esc).join(' · '),signature=(name,role,document)=>`<div class="document-signature"><strong>${esc(name)}</strong>${role?`<span>${esc(role)}</span>`:''}${document?`<span>CPF: ${esc(document)}</span>`:''}</div>`;
 return `<div class="statement-controls"><div class="statement-nav" role="group" aria-label="Demonstrações">${Object.entries(statementTypes).map(([k,n])=>`<button type="button" data-statement-report="${k}" aria-pressed="${view.report===k}" class="${view.report===k?'active':''}">${n}</button>`).join('')}</div><div class="toolbar"><label>Comparativo — de<input type="date" id="statementPreviousFrom" min="1900-01-01" value="${view.previousFrom}"></label><label>Até<input type="date" id="statementPreviousTo" min="1900-01-01" value="${view.previousTo}"></label><button data-action="statement-comparison">Aplicar comparativo</button><button data-action="statement-auto-comparison">Ano anterior</button><span class="spacer"></span><button data-action="statement-config">Classificar contas</button><button data-action="statement-header">Identificação</button>${view.report==='notes'?'<button data-action="statement-notes">Editar notas</button>':''}${view.report==='equity'?'<button data-action="statement-equity">Movimentos da DMPL</button>':''}<button data-action="statement-print">Imprimir / PDF</button></div>${!config.reviewed?'<p class="notice">As classificações iniciais são sugestões. Revise em “Classificar contas” para adequar DFC e índices ao plano desta empresa.</p>':''}</div><article class="statement-sheet"><div class="document-folio">${period.sheet?'Folha '+esc(period.sheet):''}</div><header class="document-header"><strong>${esc(h.name||c.name)}</strong><div>${line([h.document?'CNPJ: '+h.document:'',h.registration])}</div>${h.address?`<div>${esc(h.address)}</div>`:''}<h2>${esc(title)}</h2><div>PERÍODO DE ${fmtDate(from)} A ${fmtDate(to)}${hasPrevious?` · COMPARATIVO: ${fmtDate(view.previousFrom)} A ${fmtDate(view.previousTo)}`:''}</div><small>(valores expressos em reais${view.report==='ratios'?', exceto índices':''})</small></header><div class="document-content">${content}</div><div class="document-location">${line([h.place,h.date||new Date(to+'T12:00:00').toLocaleDateString(' function renderSettings(c){return `<div class="grid"><div class="card"><h2>Backup e restauração</h2><p>O backup inclui todas as empresas, contas e lançamentos. A restauração substitui todos os dados deste navegador após confirmação.</p><div class="inline"><button class="primary" data-action="backup">Exportar backup JSON</button>${legacyArchives.includes('before-plan')?'<button data-action="legacy-backup">Backup anterior à atualização</button>':''}${legacyArchives.includes('before-indexeddb')?'<button data-action="migration-backup">Backup anterior à migração</button>':''}<button data-action="restore">Restaurar backup JSON</button></div><p class="muted">O navegador não sincroniza dados entre computadores, perfis, navegadores ou cópias do HTML. No modo privado, os dados podem ser apagados ao fechar a janela. Mantenha o HTML no mesmo local e faça backup antes de movê-lo.</p></div><div class="card"><h2>Empresa atual</h2><p><strong>${esc(c.name)}</strong><br>${esc(c.document||'Sem CNPJ informado')}</p><div class="inline"><button data-action="edit-company">Editar cadastro</button><button class="danger" data-action="delete-company">Excluir empresa</button></div><p class="muted">${c.accounts.length} contas · ${c.entries.length} lançamentos</p></div></div><div class="card"><h2>Encerramento do resultado</h2><p>Gere um lançamento automático em 31/12 para zerar receitas e despesas e transferir o resultado ao patrimônio líquido. Se alterar partidas anteriores, recalcule os encerramentos afetados. O encerramento não bloqueia a edição dos lançamentos.</p><div class="inline"><button data-action="closing">Encerrar exercício</button><button data-action="recalc" ${c.entries.some(e=>e.closing)?'':'disabled'}>Recalcular encerramentos</button></div></div><div class="notice">Ferramenta básica para escrituração e relatórios gerenciais contábeis. Não gera obrigações fiscais, SPED, autenticação de livros ou demonstrativos regulatórios completos. Não há conexão com serviços externos.</div>`;}
function restore(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const file=input.files[0];if(!file)return;if(file.size>256*1024*1024)throw Error('Arquivo muito grande. Limite: 256 MiB.');const next=migrateDB(JSON.parse(await file.text()));if(!confirm(`Restaurar ${next.companies.length} empresa(s)? Todos os dados atuais serão substituídos. Faça backup antes de continuar.`))return;if(storageBusy)throw Error('Aguarde a gravação atual terminar.');setStorageBusy(true);try{await commit(next,true);entryDrafts.clear();entryViews.clear();collapsedAccounts.clear();statementViews.clear();accountFilter='';search='';render();toast('Backup restaurado e validado.');}finally{setStorageBusy(false);}}catch(e){showError('Restauração não realizada: '+storageError(e));}};input.click();}
function csv(){if(!exportRows.length){toast('Não há relatório para exportar.');return;}const cell=v=>{let s=String(v??'');if((/^\s*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))&&!/^-\d+(?:\.\d{3})*,\d{2}$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};download(`fly-${tab}-${today()}.csv`,'\uFEFF'+exportRows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}

document.querySelector('#companySelect').onchange=e=>safe(async()=>{const id=e.target.value;await mutate(next=>next.active=id);accountFilter='';search='';render();});
document.querySelector('#newCompany').onclick=()=>companyDialog();document.querySelector('#backupTop').onclick=()=>safe(backup);
document.querySelector('#dialog').onclick=e=>{if(e.target.closest('[data-action="dismiss"]'))dismiss();};document.querySelector('#dialog').addEventListener('cancel',e=>{e.preventDefault();dismiss();});
window.addEventListener('storage',e=>{if(e.key===KEY)markStorageStale('Os dados da versão antiga foram alterados em outra aba. Recarregue o Fly e confira qual versão está utilizando antes de continuar.');});
window.addEventListener('beforeunload',e=>{if(storageBusy){e.preventDefault();e.returnValue='';}});
// Block pending UI actions without changing the style of thousands of report/list rows.
for(const type of ['click','keydown','beforeinput','change','submit'])document.addEventListener(type,e=>{if(storageBusy){e.preventDefault();e.stopImmediatePropagation();}},true);
document.querySelector('#appVersion').textContent='v'+APP_VERSION;
document.title=`Fly v${APP_VERSION} • Contabilidade local`;
boot();
</script>
</body>
</html>
