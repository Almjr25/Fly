<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fly • Contabilidade local</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203047;background:#f3f5f9;font-size:14px;--blue:#245bd7;--line:#dce3ed}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;border-radius:7px;background:white;color:#203047;padding:9px 13px}button:hover{background:#edf2fc}button:disabled{opacity:.45;cursor:default}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#184bb9}.danger{color:#af2534}.small{padding:5px 9px;font-size:12px}input,select,textarea{border:1px solid #cbd5e1;border-radius:6px;background:white;padding:9px;max-width:100%;color:inherit}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #6d98f0;outline-offset:2px}label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}header{background:#14243a;color:white;display:flex;align-items:center;justify-content:space-between;padding:18px 26px;gap:18px;flex-wrap:wrap}.brand{font-size:23px;font-weight:750;letter-spacing:-1px}.brand span{font-size:12px;letter-spacing:0;font-weight:400;color:#bdcce3;margin-left:12px}.header-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.header-actions select{max-width:310px;color:#203047}nav{background:white;border-bottom:1px solid var(--line);padding:0 26px;display:flex;gap:5px;overflow:auto}nav button{border:0;border-radius:0;padding:17px 15px;white-space:nowrap;background:transparent;border-bottom:3px solid transparent}nav button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:650}main{max-width:1400px;padding:25px;margin:auto}h1{font-size:24px;letter-spacing:-.6px;margin:0 0 8px}h2{font-size:17px;margin:0 0 15px}p{line-height:1.6}.muted{color:#63738b;font-size:12px}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:20px}.toolbar .spacer{flex:1}.card{background:white;border:1px solid var(--line);border-radius:11px;padding:21px;margin-bottom:20px;box-shadow:0 2px 4px #14243a03}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.metric{font-size:25px;font-variant-numeric:tabular-nums;font-weight:650;margin-top:9px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#f6f8fc;color:#52647d;font-size:11px;text-transform:uppercase;letter-spacing:.4px}td,th{padding:12px 10px;border-bottom:1px solid #e7ecf3;white-space:nowrap}td.wrap{white-space:normal;min-width:180px;max-width:450px}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tr[data-entry]{cursor:pointer}tr[data-entry]:hover{background:#edf3ff}tr.total{font-weight:700;background:#edf2fa}.link{border:0;padding:0;background:none;color:var(--blue);text-align:left;text-decoration:underline}.tag{font-size:11px;background:#e9f0fd;color:#2e59a5;border-radius:4px;padding:3px 7px}.notice{border:1px solid #d4dfef;background:#edf3fc;border-radius:8px;padding:13px 16px;margin-bottom:18px;font-size:13px;line-height:1.6}.warning{background:#fff7e4;border-color:#f0d49a;color:#805715}.empty{text-align:center;padding:45px 15px;color:#63738b}.good{color:#14724d}.bad{color:#ad293a}.inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.footer{color:#718097;font-size:12px;text-align:center;padding:20px}dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(1050px,96vw);max-height:92vh;box-shadow:0 20px 80px #10243a38}dialog::backdrop{background:#11203880}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}.dialog-body{padding:22px}.dialog-foot{padding:16px 22px;background:#f7f9fc;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.entry-lines input{width:135px}.entry-lines select{min-width:250px;width:100%}.entry-lines td{padding:8px 5px}.error{color:#ab2437;white-space:pre-line;margin:12px 0;font-size:13px}.check{flex-direction:row;align-items:center}.check input{width:auto}.report-heading{margin-bottom:17px}.section-row{background:#f3f6fb;font-weight:650}.account-code{color:#62748e;font-size:12px}#toast{position:fixed;bottom:20px;right:20px;background:#163b2c;color:white;padding:13px 20px;border-radius:8px;z-index:10;max-width:90vw}#toast[hidden]{display:none}.account-total{font-weight:650}.report-title{display:flex;justify-content:space-between;align-items:start;gap:12px}.hide{display:none}@media(max-width:650px){main{padding:14px}header{padding:15px}.brand span{display:block;margin:3px 0}nav{padding:0 8px}.card{padding:15px}.toolbar{gap:9px}.metric{font-size:21px}.dialog-body{padding:14px}td,th{padding:10px 7px}}
</style>
</head>
<body>
<header><div class="brand">Fly<span>Contabilidade • local e offline</span></div><div class="header-actions"><label style="color:#c4d2e6">Empresa<select id="companySelect" aria-label="Empresa ativa"></select></label><button id="newCompany">+ Empresa</button><button id="backupTop">Backup JSON</button></div></header>
<nav id="nav" aria-label="Navegação principal"></nav>
<main id="main"></main><div class="footer">Os dados ficam neste navegador. Faça backups regularmente e antes de limpar dados de navegação ou trocar de computador.</div>
<dialog id="dialog"><div id="dialogContent"></div></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='fly.contabilidade.v1';
const money=n=>((n||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dec=n=>((n||0)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtDate=s=>s.split('-').reverse().join('/');
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&s.slice(0,4)>='1900'&&s.slice(0,4)<='9999'&&!isNaN(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s;
function cents(s){s=String(s).trim();if(!s)return 0;if(!/^\d+(?:\.\d{3})*(?:,\d{1,2})?$/.test(s))throw Error('Use valores como 1.234,56, sem sinal ou símbolo de moeda.');const parts=s.replace(/\./g,'').split(',');const v=Number(parts[0])*100+Number((parts[1]||'').padEnd(2,'0'));if(!Number.isSafeInteger(v)||v>1e14)throw Error('Valor fora do limite permitido.');return v;}
const kinds={asset:'Ativo',liability:'Passivo',equity:'Patrimônio líquido',revenue:'Receita',expense:'Despesa'};
const creditKind=k=>['liability','equity','revenue'].includes(k);
const compare=(a,b)=>a.code.localeCompare(b.code,'pt-BR',{numeric:true});
function initialAccounts(){const rows=[['1','Ativo','asset',false],['1.1','Ativo circulante','asset',false],['1.1.01','Caixa','asset',true],['1.1.02','Bancos conta movimento','asset',true],['1.1.03','Clientes','asset',true],['1.1.04','Estoques','asset',true],['1.2','Ativo não circulante','asset',false],['1.2.01','Imobilizado','asset',true],['1.2.02','Depreciação acumulada','asset',true],['2','Passivo','liability',false],['2.1','Passivo circulante','liability',false],['2.1.01','Fornecedores','liability',true],['2.1.02','Tributos a recolher','liability',true],['2.1.03','Obrigações trabalhistas','liability',true],['2.2','Passivo não circulante','liability',false],['2.2.01','Empréstimos de longo prazo','liability',true],['3','Patrimônio líquido','equity',false],['3.1','Capital e resultados','equity',false],['3.1.01','Capital social','equity',true],['3.1.02','Lucros ou prejuízos acumulados','equity',true],['4','Receitas','revenue',false],['4.1','Receitas operacionais','revenue',false],['4.1.01','Receita de serviços','revenue',true],['4.1.02','Receita de vendas','revenue',true],['4.1.03','Deduções da receita','revenue',true],['4.2','Outras receitas','revenue',false],['4.2.01','Receitas financeiras','revenue',true],['5','Despesas e custos','expense',false],['5.1','Custos','expense',false],['5.1.01','Custos dos serviços e mercadorias','expense',true],['5.2','Despesas operacionais','expense',false],['5.2.01','Despesas administrativas','expense',true],['5.2.02','Salários e encargos','expense',true],['5.2.03','Aluguéis','expense',true],['5.2.04','Despesas financeiras','expense',true],['5.2.05','Depreciação','expense',true]];return rows.map(([code,name,kind,postable])=>({id:uid(),code,name,kind,postable,normal:creditKind(kind)?'C':'D'}));}
function sum(nums){let n=0;for(const v of nums){n+=v;if(!Number.isSafeInteger(n))throw Error('Total excedeu a precisão segura.');}return n;}
function sortedEntries(c){return [...c.entries].sort((a,b)=>a.date.localeCompare(b.date)||Number(!!a.closing)-Number(!!b.closing)||a.number-b.number);}
function movements(c,from='',to='9999-12-31',excludeClosing=false){const out=Object.fromEntries(c.accounts.map(a=>[a.id,{debit:0,credit:0}]));for(const e of c.entries){if(e.date<from||e.date>to||(excludeClosing&&e.closing))continue;for(const l of e.lines){const m=out[l.account];if(!m)throw Error('Conta do lançamento não encontrada.');m.debit=sum([m.debit,l.debit]);m.credit=sum([m.credit,l.credit]);}}return out;}
const raw=m=>m.debit-m.credit;
const natural=(a,n)=>creditKind(a.kind)?-n:n;
function validateEntry(e,c){if(!validDate(e.date))throw Error('Informe uma data válida, a partir de 1900.');if(!e.memo?.trim())throw Error('Informe o histórico.');if(!Array.isArray(e.lines)||e.lines.length<2)throw Error('Inclua pelo menos duas partidas.');for(const l of e.lines){if(!c.accounts.some(a=>a.id===l.account&&a.postable))throw Error('Selecione uma conta analítica em cada partida.');if(!Number.isSafeInteger(l.debit)||!Number.isSafeInteger(l.credit)||l.debit<0||l.credit<0||(l.debit>0)===(l.credit>0)||Math.max(l.debit,l.credit)>1e14)throw Error('Cada partida deve ter somente um débito ou um crédito positivo.');}const d=sum(e.lines.map(l=>l.debit)),cr=sum(e.lines.map(l=>l.credit));if(d!==cr)throw Error(`Débitos e créditos não conferem. Diferença: ${money(Math.abs(d-cr))}.`);return e;}
function closeLines(c,date,target,omitId){const scope={...c,entries:c.entries.filter(e=>e.id!==omitId&&e.date<=date)};const mv=movements(scope);const lines=[];for(const a of c.accounts.filter(a=>a.postable&&['revenue','expense'].includes(a.kind))){const n=raw(mv[a.id]);if(n)lines.push({account:a.id,debit:n<0?-n:0,credit:n>0?n:0});}const net=sum(lines.map(l=>l.debit-l.credit));if(net)lines.push({account:target,debit:net<0?-net:0,credit:net>0?net:0});return lines;}
function validateDB(db){if(!db||db.version!==1||!Array.isArray(db.companies)||db.companies.length>500)throw Error('Backup incompatível: esperado formato Fly versão 1.');const ids=new Set();for(const c of db.companies){if(!c||typeof c.id!=='string'||ids.has(c.id)||typeof c.name!=='string'||!c.name.trim()||!Array.isArray(c.accounts)||!Array.isArray(c.entries))throw Error('Empresa inválida no backup.');ids.add(c.id);const ai=new Set(),codes=new Set();for(const a of c.accounts){if(typeof a.id!=='string'||ai.has(a.id)||typeof a.code!=='string'||!/^\d+(\.\d+)*$/.test(a.code)||codes.has(a.code)||typeof a.name!=='string'||!a.name.trim()||!kinds[a.kind]||typeof a.postable!=='boolean'||!['D','C'].includes(a.normal))throw Error('Plano de contas inválido.');ai.add(a.id);codes.add(a.code);}for(const a of c.accounts){const children=c.accounts.filter(b=>b.code.startsWith(a.code+'.'));if((a.postable&&children.length)||children.some(b=>b.kind!==a.kind))throw Error('Hierarquia de contas inválida.');}const ei=new Set(),numbers=new Set();for(const e of c.entries){if(typeof e.id!=='string'||ei.has(e.id)||!Number.isSafeInteger(e.number)||e.number<1||numbers.has(e.number)||typeof e.memo!=='string')throw Error('Identificação de lançamento inválida.');ei.add(e.id);numbers.add(e.number);validateEntry(e,c);if(e.closing&&(!Number.isInteger(e.year)||e.date!==`${e.year}-12-31`||!c.accounts.some(a=>a.id===e.target&&a.kind==='equity'&&a.postable)))throw Error('Encerramento inválido.');}if(new Set(c.entries.filter(e=>e.closing).map(e=>e.year)).size!==c.entries.filter(e=>e.closing).length)throw Error('Há encerramentos duplicados.');movements(c);}return db;}
let db={version:1,active:null,companies:[]},loadError='',savedRecord=null;
try{const stored=localStorage.getItem(KEY);savedRecord=stored;if(stored)db=validateDB(JSON.parse(stored));}catch(e){loadError='Não foi possível ler os dados locais. Os dados existentes não serão sobrescritos. Exporte os dados locais originais ou restaure um backup válido. Detalhe: '+e.message;}
let tab='entries',from=today().slice(0,4)+'-01-01',to=today().slice(0,4)+'-12-31',accountFilter='',search='',dialogDirty=false;
const company=()=>db.companies.find(c=>c.id===db.active)||db.companies[0];
function commit(next,restore=false){if(!restore&&(loadError||localStorage.getItem(KEY)!==savedRecord))throw Error('Os dados locais foram alterados ou não puderam ser lidos. Recarregue a página antes de salvar.');validateDB(next);const data=JSON.stringify(next);localStorage.setItem(KEY,data);savedRecord=data;db=next;loadError='';}
function mutate(fn){const next=structuredClone(db);fn(next,next.companies.find(c=>c.id===(company()?.id)));commit(next);render();}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,5000);}
function safe(fn){try{fn();}catch(e){showError(e.message);}}
function showError(msg){const el=document.querySelector('#dialogError');if(document.querySelector('#dialog').open&&el)el.textContent=msg;else{const el=document.querySelector('#pageError');el.textContent=msg;el.hidden=false;}}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function backup(){if(loadError){download('fly-dados-originais.json',localStorage.getItem(KEY)||'','application/json');return;}download(`fly-backup-${today()}.json`,JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'application/json');toast('Backup exportado. Guarde o arquivo em um local seguro.');}
function accountOptions(selected='',filter=()=>true){return company().accounts.filter(a=>a.postable&&filter(a)).sort(compare).map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(a.code+' — '+a.name)}</option>`).join('');}
function openDialog(title,body,foot){const d=document.querySelector('#dialog');document.querySelector('#dialogContent').innerHTML=`<div class="dialog-head"><h2 style="margin:0">${esc(title)}</h2><button type="button" data-action="dismiss" aria-label="Fechar">✕</button></div><form id="dialogForm"><div class="dialog-body">${body}<div id="dialogError" class="error" role="alert"></div></div><div class="dialog-foot"><button type="button" data-action="dismiss">Cancelar</button>${foot}</div></form>`;dialogDirty=false;document.querySelector('#dialogForm').addEventListener('input',()=>dialogDirty=true);if(!d.open)d.showModal();}
function dismiss(){if(dialogDirty&&!confirm('Descartar as alterações deste formulário?'))return;document.querySelector('#dialog').close();dialogDirty=false;}
function finishDialog(){document.querySelector('#dialog').close();dialogDirty=false;}
function companyDialog(edit=false){const c=edit?company():null;openDialog(edit?'Editar empresa':'Nova empresa',`<div class="grid"><label>Nome / razão social<input name="name" required maxlength="150" value="${esc(c?.name)}"></label><label>CNPJ (opcional)<input name="document" maxlength="30" value="${esc(c?.document)}"></label></div><p class="muted">Cada empresa tem seu próprio plano de contas e lançamentos. A abertura dos saldos é feita por lançamento contábil.</p>`,`<button class="primary">${edit?'Salvar':'Criar empresa'}</button>`);document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();safe(()=>{if(loadError)throw Error('Restaure ou exporte os dados locais antes de criar empresas.');const f=new FormData(e.target),name=f.get('name').trim();if(!name)throw Error('Informe o nome.');mutate((next,co)=>{if(edit){co.name=name;co.document=f.get('document').trim();}else{const id=uid();next.companies.push({id,name,document:f.get('document').trim(),accounts:initialAccounts(),entries:[]});next.active=id;}});finishDialog();toast('Empresa salva.');});};}
function invalidateClosings(c,date,except){for(const e of c.entries)if(e.closing&&e.id!==except&&e.date>=date)e.stale=true;}
function entryDialog(id){const c=company(),old=c.entries.find(e=>e.id===id);openDialog(old?`Editar lançamento #${old.number}`:'Novo lançamento',`<div class="grid"><label>Data<input type="date" name="date" required min="1900-01-01" max="9999-12-31" value="${esc(old?.date||today())}"></label><label>Documento / referência<input name="reference" maxlength="150" value="${esc(old?.reference)}"></label></div><label style="margin:16px 0">Histórico<textarea name="memo" rows="2" required maxlength="2000">${esc(old?.memo)}</textarea></label>${old?.closing?'<div class="notice warning">Este é um encerramento. A edição é permitida e será marcada para revisão. Use “Recalcular encerramentos” para reconstruí-lo a partir dos saldos.</div>':''}<div class="table-wrap"><table class="entry-lines"><thead><tr><th>Conta analítica</th><th>Débito (R$)</th><th>Crédito (R$)</th><th></th></tr></thead><tbody id="lines"></tbody></table></div><div class="toolbar" style="margin-top:14px"><button type="button" id="addLine">+ Partida</button><span class="spacer"></span><span id="entryTotals" aria-live="polite"></span></div>`,` ${old?'<button type="button" class="danger" id="deleteEntry">Excluir lançamento</button>':''}<button class="primary">Salvar lançamento</button>`);
const add=l=>{const tr=document.createElement('tr');tr.innerHTML=`<td><select aria-label="Conta"><option value="">Selecione a conta</option>${accountOptions(l?.account)}</select></td><td><input aria-label="Débito" inputmode="decimal" placeholder="0,00" value="${l?.debit?dec(l.debit):''}"></td><td><input aria-label="Crédito" inputmode="decimal" placeholder="0,00" value="${l?.credit?dec(l.credit):''}"></td><td><button type="button" class="small danger" aria-label="Remover partida">✕</button></td>`;tr.querySelector('button').onclick=()=>{tr.remove();dialogDirty=true;totals();};document.querySelector('#lines').append(tr);};
const readLines=()=>[...document.querySelectorAll('#lines tr')].map(tr=>{const [d,cr]=tr.querySelectorAll('input');return{account:tr.querySelector('select').value,debit:cents(d.value),credit:cents(cr.value)};});
function totals(){try{const ls=readLines(),d=sum(ls.map(l=>l.debit)),cr=sum(ls.map(l=>l.credit));document.querySelector('#entryTotals').innerHTML=`Débitos <b>${money(d)}</b> · Créditos <b>${money(cr)}</b> · <span class="${d===cr?'good':'bad'}">Diferença ${money(Math.abs(d-cr))}</span>`;}catch(e){document.querySelector('#entryTotals').textContent=e.message;}}
(old?.lines||[{},{}]).forEach(add);totals();document.querySelector('#addLine').onclick=()=>{add();dialogDirty=true;};document.querySelector('#lines').oninput=totals;
if(old)document.querySelector('#deleteEntry').onclick=()=>{if(!confirm(`Excluir permanentemente o lançamento #${old.number}?`))return;safe(()=>{mutate((_,co)=>{co.entries=co.entries.filter(e=>e.id!==old.id);invalidateClosings(co,old.date);});finishDialog();toast('Lançamento excluído.');});};
document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();safe(()=>{const f=new FormData(e.target),entry={...old,id:old?.id||uid(),number:old?.number||Math.max(0,...c.entries.map(e=>e.number))+1,date:f.get('date'),reference:f.get('reference').trim(),memo:f.get('memo').trim(),lines:readLines()};if(old?.closing&&entry.date!==old.date)throw Error('O encerramento deve permanecer em 31/12 do exercício.');if(old?.closing)entry.stale=true;validateEntry(entry,c);mutate((_,co)=>{const index=co.entries.findIndex(e=>e.id===entry.id);if(index<0)co.entries.push(entry);else co.entries[index]=entry;invalidateClosings(co,[entry.date,old?.date||entry.date].sort()[0],entry.id);});finishDialog();toast('Lançamento salvo. Relatórios atualizados.');});};}
function accountDialog(id){const c=company(),a=c.accounts.find(a=>a.id===id),used=c.entries.some(e=>e.lines.some(l=>l.account===id));openDialog(a?'Editar conta':'Nova conta',`<div class="grid"><label>Código hierárquico<input name="code" required pattern="[0-9]+(\\.[0-9]+)*" value="${esc(a?.code)}" placeholder="1.1.05"></label><label>Nome<input name="name" required maxlength="150" value="${esc(a?.name)}"></label><label>Grupo<select name="kind">${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${a?.kind===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Tipo<select name="postable"><option value="true" ${a?.postable!==false?'selected':''}>Analítica — recebe lançamentos</option><option value="false" ${a?.postable===false?'selected':''}>Sintética — totaliza subcontas</option></select></label><label>Natureza esperada<select name="normal"><option value="D" ${a?.normal!=='C'?'selected':''}>Devedora</option><option value="C" ${a?.normal==='C'?'selected':''}>Credora</option></select></label></div><p class="muted">Use pontos para a hierarquia. Contas sintéticas totalizam os códigos abaixo delas. O grupo determina a apresentação no balanço/DRE; a natureza informa o saldo esperado. ${used?'Esta conta já possui lançamentos: seu grupo e código são preservados.':''}</p>`,`${a?'<button type="button" class="danger" id="deleteAccount">Excluir conta</button>':''}<button class="primary">Salvar conta</button>`);
if(!a)document.querySelector('[name=kind]').onchange=e=>{document.querySelector('[name=normal]').value=creditKind(e.target.value)?'C':'D';};
if(a)document.querySelector('#deleteAccount').onclick=()=>safe(()=>{if(used)throw Error('Não é possível excluir uma conta com lançamentos.');if(c.accounts.some(b=>b.code.startsWith(a.code+'.')))throw Error('Remova primeiro as subcontas.');if(!confirm('Excluir esta conta?'))return;mutate((_,co)=>co.accounts=co.accounts.filter(b=>b.id!==id));finishDialog();});
document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();safe(()=>{const f=new FormData(e.target),n={id:a?.id||uid(),code:f.get('code').trim(),name:f.get('name').trim(),kind:f.get('kind'),postable:f.get('postable')==='true',normal:f.get('normal')};if(!n.name||!/^\d+(\.\d+)*$/.test(n.code))throw Error('Informe código e nome válidos.');if(c.accounts.some(b=>b.id!==id&&b.code===n.code))throw Error('Já existe uma conta com esse código.');if(used&&(n.code!==a.code||n.kind!==a.kind||!n.postable))throw Error('Conta com lançamentos: código, grupo e tipo analítico não podem ser alterados.');if(a&&c.accounts.some(b=>b.code.startsWith(a.code+'.'))&&n.code!==a.code)throw Error('O código de uma conta com subcontas não pode ser alterado.');mutate((_,co)=>{const i=co.accounts.findIndex(b=>b.id===id);if(i<0)co.accounts.push(n);else co.accounts[i]=n;});finishDialog();toast('Plano de contas atualizado.');});};}
function closingDialog(){const year=Number(to.slice(0,4)),c=company();openDialog('Encerrar resultado do exercício',`<div class="notice">A rotina zera os saldos de receitas e despesas até 31/12 e transfere o resultado para uma conta do patrimônio líquido. A DRE ignora as partidas de encerramento. Não é necessário usar uma conta transitória de apuração.</div><div class="grid"><label>Exercício<input type="number" min="1900" max="9999" name="year" value="${year}" required></label><label>Conta de destino do resultado<select name="target" required>${accountOptions(c.accounts.find(a=>a.code==='3.1.02')?.id,a=>a.kind==='equity')}</select></label></div><p class="muted">Encerre os exercícios em ordem. Se houver alteração posterior dos lançamentos, o sistema sinaliza os encerramentos afetados; recalcule-os para atualizar os saldos.</p>`,`<button class="primary">Gerar encerramento</button>`);document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();safe(()=>{const f=new FormData(e.target),y=Number(f.get('year')),target=f.get('target'),date=`${y}-12-31`;if(!validDate(date))throw Error('Exercício inválido.');if(c.entries.some(e=>e.closing&&e.year===y))throw Error('Esse exercício já possui encerramento. Use Recalcular encerramentos.');if(c.entries.some(e=>e.closing&&e.year>y))throw Error('Exclua os encerramentos posteriores ou recalcule-os após encerrar este exercício.');if(!c.accounts.some(a=>a.id===target&&a.kind==='equity'&&a.postable))throw Error('Escolha uma conta analítica do patrimônio líquido.');const lines=closeLines(c,date,target);if(!lines.length)throw Error('Não há saldos de resultado a encerrar.');const entry={id:uid(),number:Math.max(0,...c.entries.map(e=>e.number))+1,date,reference:'ENC-'+y,memo:`Encerramento do resultado — exercício ${y}`,lines,closing:true,year:y,target,stale:false};validateEntry(entry,c);mutate((_,co)=>co.entries.push(entry));finishDialog();toast('Encerramento gerado.');});};}
function recalc(){if(!confirm('Reconstruir todos os lançamentos de encerramento, em ordem cronológica? Edições manuais dessas partidas serão substituídas.'))return;safe(()=>{mutate((_,c)=>{const closes=c.entries.filter(e=>e.closing).sort((a,b)=>a.date.localeCompare(b.date));c.entries=c.entries.filter(e=>!e.closing);for(const e of closes){e.lines=closeLines(c,e.date,e.target);e.stale=false;if(e.lines.length){validateEntry(e,c);c.entries.push(e);}}});toast('Encerramentos recalculados. Encerramentos sem saldo foram removidos.');});}
const tabs=[['entries','Lançamentos'],['accounts','Plano de contas'],['trial','Balancete'],['ledger','Razão'],['journal','Diário'],['balance','Balanço'],['income','DRE'],['settings','Dados e empresas']];
function table(headers,rows,cls=''){return `<div class="table-wrap"><table class="${cls}"><thead><tr>${headers.map((h,i)=>`<th class="${i&&/Saldo|Débito|Crédito|Valor|Movimento|Anterior|Atual/.test(h)?'num':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Nenhum dado para este filtro.</td></tr>`}</tbody></table></div>`;}
const debitCredit=n=>n===0?'—':`${money(Math.abs(n))} ${n>0?'D':'C'}`;
let exportRows=[];
function render(){const c=company();document.querySelector('#companySelect').innerHTML=c?db.companies.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join(''):'<option>Nenhuma empresa</option>';document.querySelector('#nav').innerHTML=tabs.map(([k,n])=>`<button data-tab="${k}" class="${k===tab?'active':''}">${n}</button>`).join('');const m=document.querySelector('#main');if(!c){m.innerHTML=`<div id="pageError" class="notice warning" ${loadError?'':'hidden'}>${esc(loadError)}</div><div class="card empty"><h1>Seu escritório, no seu navegador.</h1><p>Cadastre uma empresa para começar o plano de contas e seus lançamentos contábeis.</p><button class="primary" data-action="new-company" ${loadError?'disabled':''}>+ Criar primeira empresa</button><button data-action="restore">Restaurar backup</button></div>`;bindMain();return;}
let html=`<div id="pageError" class="notice warning" ${loadError?'':'hidden'}>${esc(loadError)}</div><div class="report-title"><div><h1>${esc(tabs.find(t=>t[0]===tab)[1])}</h1><div class="muted report-heading">${esc(c.name)}${c.document?' · '+esc(c.document):''}</div></div></div>`;

exportRows=[];

function renderEntries(c){const es=sortedEntries(c).filter(e=>e.date>=from&&e.date<=to&&(!search||[e.memo,e.reference,String(e.number),...e.lines.map(l=>{const a=c.accounts.find(a=>a.id===l.account);return a.code+' '+a.name;})].join(' ').toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR'))));const total=sum(es.map(e=>sum(e.lines.map(l=>l.debit))));return `<div class="grid"><div class="card"><span class="muted">Lançamentos no filtro</span><div class="metric">${es.length}</div></div><div class="card"><span class="muted">Débitos / créditos no filtro</span><div class="metric">${money(total)}</div></div><div class="card"><span class="muted">Armazenamento</span><div class="metric" style="font-size:20px">Somente neste navegador</div><span class="muted">Sem servidor e sem conexão necessária</span></div></div><div class="card"><div class="toolbar"><label style="flex:1">Pesquisar histórico, documento, número ou conta<input id="search" value="${esc(search)}" placeholder="Pesquisar lançamentos"></label><button data-action="search">Pesquisar</button><button data-action="closing">Encerrar resultado</button></div>${table(['Nº','Data','Histórico','Documento','Valor',''],es.map(e=>`<tr data-entry="${esc(e.id)}"><td>#${e.number}</td><td>${fmtDate(e.date)}</td><td class="wrap">${esc(e.memo)} ${e.closing?'<span class="tag">Encerramento</span>':''}</td><td>${esc(e.reference)}</td><td class="num">${money(sum(e.lines.map(l=>l.debit)))}</td><td><button class="small" data-edit="${esc(e.id)}">Editar</button></td></tr>`).join(''))}<p class="muted">Clique em uma linha para editar o lançamento completo. Aberturas de saldo são lançamentos comuns, com débitos iguais aos créditos.</p></div>`;}
function renderAccounts(c){return `<div class="card"><div class="toolbar"><span class="muted">Plano inicial genérico. Adapte-o às necessidades de cada empresa.</span><span class="spacer"></span><button class="primary" data-action="new-account">+ Conta</button></div>${table(['Código','Nome','Grupo','Tipo','Natureza',''],[...c.accounts].sort(compare).map(a=>`<tr><td>${esc(a.code)}</td><td style="padding-left:${10+Math.min(5,a.code.split('.').length-1)*14}px" class="${a.postable?'':'account-total'}">${esc(a.name)}</td><td>${kinds[a.kind]}</td><td>${a.postable?'Analítica':'Sintética'}</td><td>${a.normal==='D'?'Devedora':'Credora'}</td><td><button class="small" data-account="${esc(a.id)}">Editar</button></td></tr>`).join(''))}</div>`;}
function renderTrial(c){const mv=movements(c,from,to);
const before=movements({...c,entries:c.entries.filter(e=>e.date<from)});let td=0,tc=0,op=0,end=0;const rows=c.accounts.filter(a=>a.postable).sort(compare).map(a=>{const p=raw(before[a.id]),d=mv[a.id].debit,cr=mv[a.id].credit,n=sum([p,d,-cr]);td=sum([td,d]);tc=sum([tc,cr]);op=sum([op,p]);end=sum([end,n]);exportRows.push([a.code,a.name,dec(Math.abs(p)),p>0?'D':p<0?'C':'',dec(d),dec(cr),dec(Math.abs(n)),n>0?'D':n<0?'C':'']);return `<tr><td>${esc(a.code)}</td><td><button class="link" data-ledger="${esc(a.id)}">${esc(a.name)}</button></td><td class="num">${debitCredit(p)}</td><td class="num">${money(d)}</td><td class="num">${money(cr)}</td><td class="num">${debitCredit(n)}</td></tr>`;}).join('');exportRows.unshift(['Código','Conta','Saldo anterior','D/C anterior','Débitos','Créditos','Saldo final','D/C final']);exportRows.push(['TOTAL','',dec(Math.abs(op)),op>=0?'D':'C',dec(td),dec(tc),dec(Math.abs(end)),end>=0?'D':'C']);return `<div class="notice">Saldos anteriores consideram todos os lançamentos antes de ${fmtDate(from)}. Selecione uma conta para abrir o razão.</div><div class="card">${table(['Código','Conta','Saldo anterior','Débitos','Créditos','Saldo final'],rows+`<tr class="total"><td colspan="2">Totais analíticos</td><td class="num">${debitCredit(op)}</td><td class="num">${money(td)}</td><td class="num">${money(tc)}</td><td class="num">${debitCredit(end)}</td></tr>`)}</div>`;}
function renderLedger(c){const a=c.accounts.find(a=>a.id===accountFilter);if(!a)return '<div class="card empty">Selecione uma conta analítica para consultar o razão.</div>';let balance=raw(movements({...c,entries:c.entries.filter(e=>e.date<from)})[a.id]);exportRows=[['Data','Lançamento','Histórico','Documento','Débito','Crédito','Saldo','D/C'],['','', 'Saldo anterior','','','',dec(Math.abs(balance)),balance>0?'D':balance<0?'C':'']];let rows=`<tr class="section-row"><td colspan="6">Saldo anterior</td><td class="num">${debitCredit(balance)}</td></tr>`;let td=0,tc=0;for(const e of sortedEntries(c).filter(e=>e.date>=from&&e.date<=to)){for(const l of e.lines.filter(l=>l.account===a.id)){balance=sum([balance,l.debit,-l.credit]);td=sum([td,l.debit]);tc=sum([tc,l.credit]);exportRows.push([fmtDate(e.date),e.number,e.memo,e.reference||'',dec(l.debit),dec(l.credit),dec(Math.abs(balance)),balance>0?'D':balance<0?'C':'']);rows+=`<tr data-entry="${esc(e.id)}"><td>${fmtDate(e.date)}</td><td><button class="link" data-edit="${esc(e.id)}">#${e.number}</button></td><td class="wrap">${esc(e.memo)}</td><td>${esc(e.reference)}</td><td class="num">${l.debit?money(l.debit):'—'}</td><td class="num">${l.credit?money(l.credit):'—'}</td><td class="num">${debitCredit(balance)}</td></tr>`;}}rows+=`<tr class="total"><td colspan="4">Movimento / saldo final</td><td class="num">${money(td)}</td><td class="num">${money(tc)}</td><td class="num">${debitCredit(balance)}</td></tr>`;return `<div class="card"><h2>${esc(a.code+' — '+a.name)}</h2>${table(['Data','Nº','Histórico','Documento','Débito','Crédito','Saldo'],rows)}<p class="muted">Selecione uma partida para editar o lançamento completo.</p></div>`;}
function renderJournal(c){exportRows=[['Data','Lançamento','Histórico','Documento','Código','Conta','Débito','Crédito']];let td=0,tc=0;let rows='';for(const e of sortedEntries(c).filter(e=>e.date>=from&&e.date<=to)){rows+=`<tr class="section-row" data-entry="${esc(e.id)}"><td>${fmtDate(e.date)}</td><td colspan="2"><button class="link" data-edit="${esc(e.id)}">#${e.number} · ${esc(e.memo)}</button></td><td colspan="2">${esc(e.reference)}</td></tr>`;for(const l of e.lines){const a=c.accounts.find(a=>a.id===l.account);td=sum([td,l.debit]);tc=sum([tc,l.credit]);exportRows.push([fmtDate(e.date),e.number,e.memo,e.reference||'',a.code,a.name,dec(l.debit),dec(l.credit)]);rows+=`<tr data-entry="${esc(e.id)}"><td></td><td>${esc(a.code)}</td><td class="wrap">${esc(a.name)}</td><td class="num">${l.debit?money(l.debit):'—'}</td><td class="num">${l.credit?money(l.credit):'—'}</td></tr>`;}}if(rows)rows+=`<tr class="total"><td colspan="3">Totais</td><td class="num">${money(td)}</td><td class="num">${money(tc)}</td></tr>`;exportRows.push(['','','TOTAL','','','',dec(td),dec(tc)]);return `<div class="card">${table(['Data','Código','Conta / histórico','Débito','Crédito'],rows)}</div>`;}
function aggregateRows(c,mv,kind){const as=c.accounts.filter(a=>a.kind===kind).sort(compare);return as.map(a=>{const ids=a.postable?[a.id]:c.accounts.filter(b=>b.postable&&b.code.startsWith(a.code+'.')).map(b=>b.id);const n=natural(a,sum(ids.map(id=>raw(mv[id]))));exportRows.push([a.code,a.name,a.postable?'Analítica':'Sintética',dec(n)]);return `<tr class="${a.postable?'':'section-row'}"><td>${esc(a.code)}</td><td style="padding-left:${10+Math.min(5,a.code.split('.').length-1)*12}px">${a.postable?`<button class="link" data-ledger="${esc(a.id)}">${esc(a.name)}</button>`:esc(a.name)}</td><td class="num ${n<0?'bad':''}">${money(n)}</td></tr>`;}).join('');}
function renderBalance(c){const mv=movements(c,'',to);const total=k=>sum(c.accounts.filter(a=>a.postable&&a.kind===k).map(a=>natural(a,raw(mv[a.id]))));const asset=total('asset'),liab=total('liability'),equity=total('equity'),result=sum([total('revenue'),-total('expense')]);const other=sum([liab,equity,result]);exportRows=[['Código','Conta','Tipo','Valor']];let rows='';for(const k of ['asset','liability','equity']){rows+=`<tr class="total"><td colspan="2">${kinds[k]}</td><td class="num">${money(total(k))}</td></tr>`;rows+=aggregateRows(c,mv,k);}rows+=`<tr><td></td><td>Resultado ainda não transferido ao patrimônio líquido</td><td class="num">${money(result)}</td></tr><tr class="total"><td colspan="2">Total do ativo</td><td class="num">${money(asset)}</td></tr><tr class="total"><td colspan="2">Total do passivo + patrimônio líquido + resultado</td><td class="num">${money(other)}</td></tr>`;exportRows.push(['','Resultado não transferido','',dec(result)],['','Total do ativo','',dec(asset)],['','Total passivo + PL + resultado','',dec(other)]);return `<div class="notice">Posição acumulada até ${fmtDate(to)}. O campo “De” não limita os saldos do balanço. Contas sintéticas são subtotais; não devem ser somadas novamente. Resultado pendente de encerramento é apresentado separadamente. Clique nas contas analíticas para consultar o razão acumulado.</div><div class="card">${table(['Código','Conta','Valor'],rows)}<p class="${asset===other?'good':'bad'}">${asset===other?'✓ Balanço equilibrado.':'Balanço com diferença: '+money(asset-other)}</p></div>`;}
function renderIncome(c){const mv=movements(c,from,to,true);const revenue=sum(c.accounts.filter(a=>a.postable&&a.kind==='revenue').map(a=>-raw(mv[a.id]))),expense=sum(c.accounts.filter(a=>a.postable&&a.kind==='expense').map(a=>raw(mv[a.id]))),result=sum([revenue,-expense]);exportRows=[['Código','Conta','Tipo','Valor']];let rows=aggregateRows(c,mv,'revenue');rows+=`<tr class="total"><td colspan="2">Total de receitas, líquido das deduções</td><td class="num">${money(revenue)}</td></tr>`;rows+=aggregateRows(c,mv,'expense');rows+=`<tr class="total"><td colspan="2">Total de despesas e custos</td><td class="num">${money(expense)}</td></tr><tr class="total"><td colspan="2">${result>=0?'Lucro':'Prejuízo'} do período</td><td class="num ${result<0?'bad':'good'}">${money(result)}</td></tr>`;exportRows.push(['','Total de receitas','',dec(revenue)],['','Total de despesas e custos','',dec(expense)],['','Resultado do período','',dec(result)]);return `<div class="notice">DRE básica por grupo de contas: receitas menos custos e despesas. Partidas marcadas como encerramento são excluídas. Saldos negativos nas receitas representam deduções ou ajustes. Clique em uma conta para examinar suas partidas no razão.</div><div class="card">${table(['Código','Conta','Valor'],rows)}</div>`;}
function renderSettings(c){return `<div class="grid"><div class="card"><h2>Backup e restauração</h2><p>O backup inclui todas as empresas, contas e lançamentos. A restauração substitui todos os dados deste navegador após confirmação.</p><div class="inline"><button class="primary" data-action="backup">Exportar backup JSON</button><button data-action="restore">Restaurar backup JSON</button></div><p class="muted">O navegador não sincroniza dados entre computadores, perfis, navegadores ou cópias do HTML. No modo privado, os dados podem ser apagados ao fechar a janela. Mantenha o HTML no mesmo local e faça backup antes de movê-lo.</p></div><div class="card"><h2>Empresa atual</h2><p><strong>${esc(c.name)}</strong><br>${esc(c.document||'Sem CNPJ informado')}</p><div class="inline"><button data-action="edit-company">Editar cadastro</button><button class="danger" data-action="delete-company">Excluir empresa</button></div><p class="muted">${c.accounts.length} contas · ${c.entries.length} lançamentos</p></div></div><div class="card"><h2>Encerramento do resultado</h2><p>Gere um lançamento automático em 31/12 para zerar receitas e despesas e transferir o resultado ao patrimônio líquido. Se alterar partidas anteriores, recalcule os encerramentos afetados. O encerramento não bloqueia a edição dos lançamentos.</p><div class="inline"><button data-action="closing">Encerrar exercício</button><button data-action="recalc" ${c.entries.some(e=>e.closing)?'':'disabled'}>Recalcular encerramentos</button></div></div><div class="notice">Ferramenta básica para escrituração e relatórios gerenciais contábeis. Não gera obrigações fiscais, SPED, autenticação de livros ou demonstrativos regulatórios completos. Não há conexão com serviços externos.</div>`;}
function restore(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const file=input.files[0];if(!file)return;if(file.size>30*1024*1024)throw Error('Arquivo muito grande. Limite: 30 MB.');const next=validateDB(JSON.parse(await file.text()));if(!confirm(`Restaurar ${next.companies.length} empresa(s)? Todos os dados atuais serão substituídos. Faça backup antes de continuar.`))return;commit(next,true);accountFilter='';search='';render();toast('Backup restaurado e validado.');}catch(e){showError('Restauração não realizada: '+e.message);}};input.click();}
function csv(){if(!exportRows.length){toast('Não há relatório para exportar.');return;}const cell=v=>{let s=String(v??'');if((/^\s*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))&&!/^-\d+(?:\.\d{3})*,\d{2}$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};download(`fly-${tab}-${today()}.csv`,'\uFEFF'+exportRows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function applyPeriod(){const f=document.querySelector('#from').value,t=document.querySelector('#to').value;if(!validDate(f)||!validDate(t)||f>t)throw Error('Informe um período válido: a data inicial deve ser anterior ou igual à final.');from=f;to=t;render();}
function bindMain(){document.querySelector('#main').onclick=e=>{const b=e.target.closest('[data-action],[data-entry],[data-edit],[data-account],[data-ledger]');if(!b)return;safe(()=>{if(b.dataset.edit||b.dataset.entry){entryDialog(b.dataset.edit||b.dataset.entry);return;}if(b.dataset.account){accountDialog(b.dataset.account);return;}if(b.dataset.ledger){accountFilter=b.dataset.ledger;if(tab==='balance')from='1900-01-01';tab='ledger';render();return;}switch(b.dataset.action){case'new-company':companyDialog();break;case'new-entry':entryDialog();break;case'new-account':accountDialog();break;case'edit-company':companyDialog(true);break;case'closing':closingDialog();break;case'recalc':recalc();break;case'backup':backup();break;case'restore':restore();break;case'csv':csv();break;case'apply':applyPeriod();break;case'search':search=document.querySelector('#search').value;render();break;case'delete-company':if(confirm(`Excluir a empresa ${company().name} e todos os seus dados? Esta ação é permanente.`)){mutate((next,c)=>{next.companies=next.companies.filter(x=>x.id!==c.id);next.active=next.companies[0]?.id||null;});accountFilter='';}break;}});};const sel=document.querySelector('#ledgerAccount');if(sel)sel.onchange=e=>{accountFilter=e.target.value;render();};const s=document.querySelector('#search');if(s)s.onkeydown=e=>{if(e.key==='Enter'){search=s.value;render();}};}
document.querySelector('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();}};
